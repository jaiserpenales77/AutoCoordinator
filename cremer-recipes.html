<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cremer Recipe Finder</title>
<meta name="description" content="Search Cremer counter settings for Line 9 and Line 10 by FG item, bulk item or bottle size.">
<style>
:root{
  --bg:#f4f6fb; --bg2:#e9edf7; --card:#ffffff; --ink:#111827; --ink2:#4b5563; --ink3:#8a94a6;
  --line:#e3e7f0; --accent:#4f46e5; --accent2:#7c3aed; --accent-soft:#eef0ff; --ok:#059669; --ok-soft:#e7f8f1;
  --off:#9ca3af; --off-soft:#f1f3f7; --diff:#fff4d6; --diff-ink:#8a5a00; --shadow:0 1px 2px rgba(17,24,39,.05),0 8px 24px rgba(17,24,39,.06);
  --shadow-lg:0 20px 60px rgba(17,24,39,.18); --r:16px;
  --c-g:#16a34a; --c-y:#d4a20b; --c-b:#2563eb; --c-p:#db2777; --c-v:#9333ea;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0f17; --bg2:#121726; --card:#161b2b; --ink:#eef1f8; --ink2:#b3bbcc; --ink3:#7a849a; --line:#252c40;
  --accent:#8b8cff; --accent2:#b18cff; --accent-soft:#22254a; --ok:#34d399; --ok-soft:#10302a; --off:#6b7280; --off-soft:#1d2233;
  --diff:#3a2f12; --diff-ink:#ffd27a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 20px 60px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#0c0f17; --bg2:#121726; --card:#161b2b; --ink:#eef1f8; --ink2:#b3bbcc; --ink3:#7a849a; --line:#252c40;
  --accent:#8b8cff; --accent2:#b18cff; --accent-soft:#22254a; --ok:#34d399; --ok-soft:#10302a; --off:#6b7280; --off-soft:#1d2233;
  --diff:#3a2f12; --diff-ink:#ffd27a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 20px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:22px 16px 74px}
.hero::after{content:"";position:absolute;inset:auto -10% -60% auto;width:420px;height:420px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.18),transparent);animation:float 9s ease-in-out infinite}
@keyframes float{50%{transform:translate(-30px,-20px)}}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;backdrop-filter:blur(4px)}
.brand h1{margin:0;font-size:20px;letter-spacing:-.01em}
.brand p{margin:0;opacity:.85;font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;transition:transform .15s,background .2s}
.icon-btn:hover{background:rgba(255,255,255,.22)}
.icon-btn:active{transform:scale(.92)}

.panel{max-width:1180px;margin:-54px auto 0;padding:0 16px;position:relative;z-index:2}
.searchbox{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;border:1px solid var(--line)}
.search{display:flex;align-items:center;gap:10px;background:var(--bg);border:2px solid transparent;border-radius:12px;padding:0 12px;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{flex:none;color:var(--ink3)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:17px;padding:13px 0;color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
.kbd{font-size:12px;color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.clear{border:0;background:var(--line);width:26px;height:26px;border-radius:50%;display:none;place-items:center;color:var(--ink2)}
.search.has .clear{display:grid}.search.has .kbd{display:none}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:12px}
.fgroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.flabel{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-right:2px}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;position:relative}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink2);position:relative;z-index:1;transition:color .2s}
.seg button.on{color:var(--ink)}
.seg .pill{position:absolute;top:3px;bottom:3px;border-radius:8px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:left .25s cubic-bezier(.3,.7,.2,1),width .25s cubic-bezier(.3,.7,.2,1)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;transition:all .18s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:active{transform:scale(.95)}
.sortsel{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;font-size:14px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 10px;color:var(--ink2);font-size:14px;flex-wrap:wrap}
.bar b{color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:0 16px 120px}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s;animation:rise .38s cubic-bezier(.2,.8,.2,1) both;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--sc)}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--sc) 45%,var(--line))}
.card:active{transform:translateY(-1px) scale(.99)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fg{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.bulk{color:var(--ink2);font-weight:600;font-size:14px;margin-top:2px}
.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.badge.size{background:color-mix(in srgb,var(--sc) 16%,transparent);color:var(--sc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.stat{background:var(--bg);border-radius:10px;padding:7px 8px}
.stat span{display:block;font-size:11px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat b{font-size:17px}
.card-f{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.mini{font-size:12px;color:var(--ink3)}
.star{border:0;background:transparent;padding:4px;border-radius:8px;color:var(--ink3);transition:transform .2s,color .2s;line-height:0}
.star.on{color:#f5a524}
.star.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.45) rotate(-12deg)}}
.cmp-tog{border:1px solid var(--line);background:transparent;border-radius:8px;font-size:12px;font-weight:700;padding:4px 8px;color:var(--ink2);transition:all .15s}
.cmp-tog.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}

.empty{text-align:center;padding:60px 16px;color:var(--ink2);animation:rise .4s both}
.empty .big{font-size:44px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--bg);z-index:21;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.show{transform:none}
.d-head{padding:18px 18px 16px;background:var(--card);border-bottom:1px solid var(--line);position:relative}
.d-head::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--sc)}
.d-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.d-title{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.d-sub{color:var(--ink2);font-weight:600;margin-top:4px}
.close{border:0;background:var(--bg);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;transition:transform .15s,background .2s;flex:none}
.close:hover{background:var(--line)}.close:active{transform:scale(.9)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:transform .15s,background .2s,border-color .2s;position:relative;overflow:hidden}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(3.2);opacity:0}}
.d-body{overflow:auto;padding:16px 18px 40px;flex:1}
.dfilter{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;margin-bottom:12px;outline:0;transition:border-color .2s}
.dfilter:focus{border-color:var(--accent)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;animation:rise .35s both}
.sec h3{margin:0;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);padding:11px 14px 6px;display:flex;align-items:center;gap:8px}
.sec h3 i{width:8px;height:8px;border-radius:3px;background:var(--accent);display:inline-block}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 14px;border-top:1px solid var(--line);transition:background .2s}
.kv:first-of-type{border-top:0}
.kv:hover{background:var(--bg)}
.kv .k{color:var(--ink2);font-size:14px}
.kv .v{font-weight:700;font-size:16px;text-align:right}
.kv .v.blank{color:var(--ink3);font-weight:500}
.kv.hl{background:var(--accent-soft)}
.tog{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.05em}
.tog.on{background:var(--ok-soft);color:var(--ok)}
.tog.off{background:var(--off-soft);color:var(--off)}
.related{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px 14px}
.related .chip{font-size:12.5px}
.note{font-size:13px;color:var(--ink2);padding:4px 14px 12px}

/* ---------- compare tray / modal ---------- */
.tray{position:fixed;left:50%;bottom:16px;transform:translate(-50%,140%);background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);z-index:15;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);max-width:calc(100% - 32px)}
.tray.show{transform:translate(-50%,0)}
.tray .t{font-weight:600;font-size:14px;white-space:nowrap}
.tray .btn{background:var(--accent);border-color:var(--accent);color:#fff}
.tray .x{background:transparent;border:0;color:inherit;opacity:.7;padding:6px}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;pointer-events:none;padding:16px}
.modal .box{pointer-events:auto;background:var(--bg);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:980px;min-width:0;max-height:calc(100vh - 32px);display:flex;flex-direction:column;opacity:0;transform:scale(.94) translateY(10px);transition:all .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.modal.show .box{opacity:1;transform:none;visibility:visible}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--card);border-radius:18px 18px 0 0;flex-wrap:wrap}
.m-head h2{margin:0;font-size:18px}
.m-body{overflow:auto;padding:0 0 12px}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.cmp th,.cmp td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);z-index:1}
.cmp thead th{position:sticky;top:0;background:var(--card);z-index:2;vertical-align:bottom}
.cmp thead th:first-child{z-index:3;background:var(--card)}
.cmp .grp td{background:var(--bg2);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:700;text-align:left}
.cmp tr.d td:not(:first-child){background:var(--diff);color:var(--diff-ink);font-weight:700}
.cmp .hfg{font-size:18px;font-weight:800;display:block}
.cmp .hsub{font-size:12px;color:var(--ink2);font-weight:600}
.cmp .rm{border:0;background:transparent;color:var(--ink3);font-size:12px;padding:2px 0;text-decoration:underline}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none}
.switch input{display:none}
.switch .sw{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+.sw{background:var(--accent)}
.switch input:checked+.sw::after{transform:translateX(16px)}

.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-160%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:50;transition:transform .3s cubic-bezier(.2,.9,.3,1.3),opacity .2s;box-shadow:var(--shadow-lg);opacity:0}
.toast.show{transform:translate(-50%,0);opacity:1}
footer{text-align:center;color:var(--ink3);font-size:12.5px;padding:10px 16px 30px}

@media (max-width:640px){
  .hero{padding-bottom:66px}.brand p{display:none}
  .fg{font-size:20px}.d-title{font-size:26px}
  .kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff}.hero,.panel,main,.tray,.scrim,.actions,.close,.dfilter,footer{display:none!important}
  .drawer{position:static;transform:none;width:100%;box-shadow:none;height:auto}
  .d-body{overflow:visible}.sec{break-inside:avoid}
}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6v3l2 3v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V8l2-3z"/><path d="M7 12h10"/><circle cx="12" cy="16" r="1.4"/></svg>
      </div>
      <div><h1>Cremer Recipe Finder</h1><p>Counter settings · Line 9 &amp; Line 10</p></div>
    </div>
    <button class="icon-btn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<section class="panel">
  <div class="searchbox">
    <label class="search" id="searchWrap">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search FG item or bulk item… e.g. 2684, A641, HL000589" aria-label="Search recipes">
      <span class="kbd">/</span>
      <button class="clear" id="clear" type="button" aria-label="Clear search">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </label>
    <div class="filters">
      <div class="fgroup"><span class="flabel">Line</span>
        <div class="seg" id="lineSeg"><span class="pill"></span>
          <button data-v="all" class="on">All</button><button data-v="9">Line 9</button><button data-v="10">Line 10</button>
        </div>
      </div>
      <div class="fgroup"><span class="flabel">Bottle</span><div class="fgroup" id="sizes"></div></div>
      <div class="fgroup" style="margin-left:auto">
        <button class="chip" id="favOnly" type="button">★ Favorites</button>
        <select class="sortsel" id="sort" aria-label="Sort">
          <option value="fg">Sort: FG item</option>
          <option value="bulk">Sort: Bulk item</option>
          <option value="count">Sort: Count</option>
          <option value="bpm">Sort: Bottles / min</option>
          <option value="size">Sort: Bottle size</option>
        </select>
      </div>
    </div>
  </div>
</section>

<main>
  <div class="bar"><div id="summary"></div><div class="mini">Tap a recipe for all settings · tick <b>Compare</b> to line them up</div></div>
  <div class="grid" id="grid"></div>
</main>
<footer>Source: Cremer Recipe Guide Line 9 &amp; Line 10 (10.06.26). Always confirm on the machine before running.</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Recipe settings"></aside>

<div class="tray" id="tray">
  <span class="t" id="trayT"></span>
  <button class="btn" id="trayGo" type="button">Compare</button>
  <button class="x" id="trayX" type="button" aria-label="Clear compare">✕</button>
</div>
<div class="modal" id="modal"><div class="box" role="dialog" aria-label="Compare recipes">
  <div class="m-head">
    <h2>Compare recipes</h2>
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <label class="switch"><input type="checkbox" id="onlyDiff"><span class="sw"></span>Only differences</label>
      <button class="close" id="mClose" aria-label="Close compare"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
  </div>
  <div class="m-body" id="mBody"></div>
</div></div>
<div class="toast" id="toast"></div>

        <div class="stat"><span>Count</span><b class="num">${plain('count',r.count)}</b></div>
        <div class="stat"><span>BPM</span><b class="num">${plain('bpm',r.bpm)}</b></div>
        <div class="stat"><span>Dosing</span><b class="num">${plain('dosingSpeed',r.dosingSpeed)}</b></div>
      </div>
      <div class="card-f">
        <button class="cmp-tog ${c?'on':''}" data-cmp="${r.uid}" type="button">${c?'✓ Comparing':'+ Compare'}</button>
        <button class="star ${f?'on':''}" data-fav="${r.uid}" type="button" aria-label="Favorite">${f?STAR:STAR_O}</button>
      </div></div>`;
  }).join('');
}
$('#grid').addEventListener('click', e => {
  const fb = e.target.closest('[data-fav]'); if (fb){ toggleFav(+fb.dataset.fav, fb); return; }
  const cb = e.target.closest('[data-cmp]'); if (cb){ toggleCmp(+cb.dataset.cmp); return; }
  const card = e.target.closest('.card'); if (card) openDrawer(+card.dataset.u);
});
$('#grid').addEventListener('keydown', e => { if((e.key==='Enter'||e.key===' ') && e.target.classList.contains('card')){ e.preventDefault(); openDrawer(+e.target.dataset.u); } });

function toggleFav(uid, btn){
  const k = recipeKey(R[uid]);
  favs.has(k) ? favs.delete(k) : favs.add(k); store.set('favs',[...favs]);
  if (btn){ btn.classList.toggle('on', favs.has(k)); btn.innerHTML = favs.has(k)?STAR:STAR_O; btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop'); }
  if (state.fav) render();
  toast(favs.has(k) ? '★ Added to favorites' : 'Removed from favorites');
}

/* ---------- compare ---------- */
function toggleCmp(uid){
  const i = cmp.indexOf(uid);
  if (i>=0) cmp.splice(i,1);
  else { if (cmp.length>=4){ toast('Compare up to 4 recipes'); return; } cmp.push(uid); }
  document.querySelectorAll(`[data-cmp="${uid}"]`).forEach(b=>{ const on=cmp.includes(uid); b.classList.toggle('on',on); b.textContent=on?'✓ Comparing':'+ Compare'; });
  updateTray();
}
function updateTray(){
  $('#tray').classList.toggle('show', cmp.length>0);
  $('#trayT').textContent = cmp.length===1 ? '1 recipe picked — add another' : `${cmp.length} recipes picked`;
  $('#trayGo').disabled = cmp.length<2; $('#trayGo').style.opacity = cmp.length<2?.5:1;
  if ($('#modal').classList.contains('show')) { if (cmp.length<2) closeModal(); else renderCompare(); }
}
$('#trayX').onclick = () => { cmp.splice(0); render(); updateTray(); };
$('#trayGo').onclick = () => { if (cmp.length>1) openModal(); };
function renderCompare(){
  const rs = cmp.map(u=>R[u]), only = $('#onlyDiff').checked;
  let h = `<table class="cmp"><thead><tr><th></th>${rs.map(r=>`<th style="border-top:4px solid ${colorOf(r)}"><span class="hfg">${esc(r.fg)}</span><span class="hsub">${esc(r.bulk)} · L${r.line} · ${r.size}cc</span><br><button class="rm" data-rm="${r.uid}">remove</button></th>`).join('')}</tr></thead><tbody>`;
  let shown = 0;
  for (const g of GROUPS){
    const rows = FIELDS.filter(f=>f.group===g && f.key!=='id').map(f=>{
      const vals = rs.map(r=>plain(f.key,r[f.key])), diff = new Set(vals).size>1;
      if (only && !diff) return '';
      shown++;
      return `<tr class="${diff?'d':''}"><td>${esc(f.label)}</td>${rs.map(r=>`<td class="num">${fmt(f.key,r[f.key])}</td>`).join('')}</tr>`;
    }).join('');
    if (rows) h += `<tr class="grp"><td colspan="${rs.length+1}">${esc(g)}</td></tr>` + rows;
  }
  if (!shown) h += `<tr><td colspan="${rs.length+1}" style="text-align:center;padding:30px">These recipes use identical settings 🎉</td></tr>`;
  $('#mBody').innerHTML = h + '</tbody></table>';
}
$('#mBody').addEventListener('click', e => { const b=e.target.closest('[data-rm]'); if(b){ toggleCmp(+b.dataset.rm); } });
$('#onlyDiff').onchange = renderCompare;
function openModal(){ closeDrawer(); renderCompare(); $('#modal').classList.add('show'); $('#scrim').classList.add('show'); }
function closeModal(){ $('#modal').classList.remove('show'); $('#scrim').classList.remove('show'); }
$('#mClose').onclick = closeModal;

/* ---------- detail drawer ---------- */
let current = null;
function openDrawer(uid){
  const r = R[uid]; current = uid;
  const same = R.filter(x=>x.uid!==uid && x.fg===r.fg);
  const sameBulk = R.filter(x=>x.uid!==uid && x.bulk && x.bulk===r.bulk && x.fg!==r.fg);
  const f = favs.has(recipeKey(r));
  let h = `<div class="d-head" style="--sc:${colorOf(r)}">
    <div class="d-row"><div><div class="d-title">${esc(r.fg)}</div><div class="d-sub">${esc(r.bulk)} &nbsp;·&nbsp; Line ${r.line} &nbsp;·&nbsp; ${r.size} cc bottle</div></div>
    <button class="close" id="dClose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="actions">
      <button class="btn primary" id="dCopy" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy settings</button>
      <button class="btn" id="dFav" type="button">${f?'★ Favorite':'☆ Favorite'}</button>
      <button class="btn" id="dCmp" type="button">${cmp.includes(uid)?'✓ In compare':'+ Compare'}</button>
      <button class="btn" id="dPrint" type="button">Print</button>
    </div></div>
  <div class="d-body"><input class="dfilter" id="dFilter" placeholder="Find a setting… e.g. speed, pocket, gate" aria-label="Find a setting">`;
  if (same.length || sameBulk.length){
    h += `<div class="sec"><h3><i style="background:${colorOf(r)}"></i>Related recipes</h3>`;
    if (same.length) h += `<div class="note">Same FG item in another recipe:</div><div class="related">${same.map(x=>`<button class="chip" data-go="${x.uid}">${esc(x.fg)} · L${x.line} · ${x.size}cc${x.sheet!==r.sheet&&x.line===r.line?' ('+esc(x.sheet)+')':''}</button>`).join('')}</div>`;
    if (sameBulk.length) h += `<div class="note">Same bulk <b>${esc(r.bulk)}</b> — a good starting point for vibratory &amp; dosing settings:</div><div class="related">${sameBulk.map(x=>`<button class="chip" data-go="${x.uid}">${esc(x.fg)} · L${x.line} · ${x.size}cc</button>`).join('')}</div>`;
    h += `</div>`;
  }
  GROUPS.forEach((g,gi)=>{
    const rows = FIELDS.filter(f=>f.group===g && f.key!=='id');
    h += `<div class="sec" data-g style="animation-delay:${gi*40}ms"><h3><i style="background:${colorOf(r)}"></i>${esc(g)}</h3>${rows.map(f=>`<div class="kv" data-l="${esc(f.label.toLowerCase())}"><span class="k">${esc(f.label)}</span>${fmt(f.key,r[f.key])}</div>`).join('')}</div>`;
  });
  h += `<div class="note">Sheet in workbook: “${esc(r.sheet)}” · ID on sheet: ${esc(r.id)}</div></div>`;
  const d = $('#drawer'); d.innerHTML = h; d.scrollTop = 0;
  d.classList.add('show'); d.setAttribute('aria-hidden','false'); $('#scrim').classList.add('show');
  $('#dClose').onclick = closeDrawer;
  $('#dFav').onclick = () => { toggleFav(uid); $('#dFav').textContent = favs.has(recipeKey(r))?'★ Favorite':'☆ Favorite'; render(); };
  $('#dCmp').onclick = () => { toggleCmp(uid); $('#dCmp').textContent = cmp.includes(uid)?'✓ In compare':'+ Compare'; };
  $('#dPrint').onclick = () => window.print();
  $('#dCopy').onclick = () => copyRecipe(r);
  $('#dFilter').oninput = e => {
    const t = e.target.value.toLowerCase().trim();
    d.querySelectorAll('.sec[data-g]').forEach(s=>{
      let any=false; s.querySelectorAll('.kv').forEach(kv=>{ const m=!t||kv.dataset.l.includes(t); kv.style.display=m?'':'none'; kv.classList.toggle('hl',!!t&&m); any=any||m; });
      s.style.display = any ? '' : 'none';
    });
  };
  d.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openDrawer(+b.dataset.go));
  setTimeout(()=>$('#dClose').focus({preventScroll:true}),50);
}
function closeDrawer(){ const d=$('#drawer'); d.classList.remove('show'); d.setAttribute('aria-hidden','true'); if(!$('#modal').classList.contains('show')) $('#scrim').classList.remove('show'); render(); }
$('#scrim').onclick = () => { closeModal(); closeDrawer(); };
function copyRecipe(r){
  let t = `Cremer recipe — ${r.fg} ${r.bulk} · Line ${r.line} · ${r.size}cc\n`;
  GROUPS.forEach(g=>{ t += `\n${g.toUpperCase()}\n`; FIELDS.filter(f=>f.group===g&&f.key!=='id').forEach(f=>t+=`  ${f.label}: ${plain(f.key,r[f.key])}\n`); });
  const done = () => toast('✓ Settings copied');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, ()=>fallback());
  else fallback();
  function fallback(){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('Copy not available'); } a.remove(); }
}

/* ---------- start ---------- */
renderSizes(); render();
requestAnimationFrame(()=>movePill($('#lineSeg')));
addEventListener('resize', ()=>movePill($('#lineSeg')));
</script>
</body>
</html>
