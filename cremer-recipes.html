<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cremer Recipes</title>
<meta name="description" content="Look up Cremer counter settings for Line 9 and Line 10 by FG item or bulk item.">
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#15171c; --ink2:#5b6270; --ink3:#9298a4; --line:#e6e8ec;
  --accent:#3b5bdb; --accent-soft:#edf1ff; --ok:#0f9d58; --diff:#fff5d1;
  --c-g:#22a35a; --c-y:#d9a400; --c-b:#2f6fe0; --c-p:#e0479e; --c-v:#8b4ce0;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05); --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --card:#181b21; --ink:#eceef2; --ink2:#a6adba; --ink3:#6f7684; --line:#272b33;
  --accent:#7d95ff; --accent-soft:#1e2540; --ok:#3ccf86; --diff:#3a3214; --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0f1115; --card:#181b21; --ink:#eceef2; --ink2:#a6adba; --ink3:#6f7684; --line:#272b33;
  --accent:#7d95ff; --accent-soft:#1e2540; --ok:#3ccf86; --diff:#3a3214; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* header */
header{padding:28px 0 18px}
.top{position:relative;text-align:center;padding-left:46px;padding-right:46px}
.top #theme{position:absolute;right:0;top:50%;margin-top:-19px}
h1{margin:0;font-size:24px;letter-spacing:-.02em}
.sub{color:var(--ink2);font-size:14px;margin-top:2px}
.ghost{border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);transition:transform .12s;flex:none}
.ghost:active{transform:scale(.92)}

/* search + filters */
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 12px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:0 14px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{flex:none;color:var(--ink3)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:17px;padding:14px 0}
.search input::placeholder{color:var(--ink3)}
.search input::-webkit-search-cancel-button{display:none}
.clear{border:0;background:var(--line);width:24px;height:24px;border-radius:50%;display:none;place-items:center;color:var(--ink2)}
.search.has .clear{display:grid}
.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:7px;transition:background .15s,color .15s,border-color .15s,transform .1s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.sep{flex-basis:100%;height:0}

/* list */
.count{color:var(--ink3);font-size:13px;margin:4px 2px 8px;text-align:center}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;text-align:center;border:0;background:transparent;padding:13px 16px;border-top:1px solid var(--line);transition:background .12s;animation:in .25s ease-out both}
.row:first-child{border-top:0}
.row:hover{background:var(--bg)}
.row:active{background:var(--accent-soft)}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.row .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sc);margin-right:6px;vertical-align:1px}
.row .main{min-width:0}
.row .fg{font-weight:700;font-size:17px}
.row .bulk{color:var(--ink2);font-size:14px}
.row .meta{color:var(--sc);font-size:12.5px;font-weight:700;white-space:nowrap;margin-top:4px;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--sc) 12%,transparent)}
mark{background:transparent;color:var(--accent);font-weight:800}
.empty{text-align:center;padding:48px 16px;color:var(--ink2)}
.more{display:block;margin:12px auto 0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 16px;font-weight:600;color:var(--ink2)}
footer{text-align:center;color:var(--ink3);font-size:12.5px;padding:28px 16px 90px}

/* detail panel */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);z-index:21;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.panel.show{transform:none}
.p-head{background:var(--card);border-bottom:1px solid var(--line);padding:16px 18px}
.p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.p-fg{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.p-bulk{color:var(--ink2);font-weight:600;font-size:15px;margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--sc) 14%,transparent);color:var(--sc)}
.tag .dot{width:8px;height:8px;border-radius:50%;background:var(--sc)}
.p-body{flex:1;overflow:auto;padding:16px 18px 30px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.key{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.key b{display:block;font-size:22px;font-weight:800}
.key span{font-size:11.5px;color:var(--ink2);font-weight:600}
.sec{margin-bottom:16px}
.sec h3{margin:0 0 6px 2px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 14px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{color:var(--ink2);font-size:14px}
.kv .v{font-weight:700;font-variant-numeric:tabular-nums}
.v.blank{color:var(--ink3);font-weight:400}
.on-off{font-size:12px;font-weight:800;letter-spacing:.04em}
.on-off.on{color:var(--ok)}.on-off.off{color:var(--ink3)}
.also{display:flex;flex-wrap:wrap;gap:6px}
.p-foot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--card)}
.btn{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px;transition:transform .1s,background .15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.note{color:var(--ink3);font-size:12.5px;margin-top:6px}

/* compare */
.tray{position:fixed;left:50%;bottom:16px;transform:translate(-50%,160%);z-index:15;background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100% - 32px);white-space:nowrap}
.tray.show{transform:translate(-50%,0)}
.tray span{overflow:hidden;text-overflow:ellipsis}
.tray .btn{flex:none;background:var(--accent);border-color:var(--accent);color:#fff;padding:8px 14px}
.tray .x{border:0;background:transparent;color:inherit;opacity:.6;padding:6px 8px}
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
.mbox{pointer-events:auto;width:100%;max-width:900px;min-width:0;max-height:calc(100vh - 32px);background:var(--card);border-radius:16px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);opacity:0;transform:scale(.97);visibility:hidden;transition:opacity .2s,transform .2s,visibility .2s}
.modal.show .mbox{opacity:1;transform:none;visibility:visible}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.m-head h2{margin:0;font-size:17px}
.m-body{overflow:auto}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);font-weight:600;cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
thead th{position:sticky;top:0;background:var(--card);z-index:2}
thead th:first-child{z-index:3}
th .f{display:block;font-size:17px;font-weight:800}
th .s{font-size:12px;color:var(--ink2);font-weight:600}
th .rm{border:0;background:none;color:var(--ink3);font-size:12px;text-decoration:underline;padding:0}
tr.g td{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:700;background:var(--bg);text-align:left}
tr.g td:first-child{background:var(--bg)}
tr.d td:not(:first-child){background:var(--diff);font-weight:700}

.toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:50;transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  h1{font-size:21px}.row .meta{font-size:12px}
  .keys{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff}.wrap,footer,.scrim,.tray,.p-foot,.ghost{display:none!important}
  .panel{position:static;transform:none;width:100%}.p-body{overflow:visible}.sec{break-inside:avoid}
}
</style>
</head>

    </div></div>
  <div class="m-body" id="mBody"></div>
</div></div>

:0,"dosingStartSpeed":1000,"ionizer":1,"upsideSensor":0,"bpm":60,"diameter":70,"speedBalance":0,"screwHeight":120,"beltSpeed":110,"screwAngle":400,"handlingDischarge":25,"pockets":8,"gateOpen":300,"gateClose":170,"sideSensor":310,"funnel":0,"fg":"3254","bulk":"PK000341","line":10,"size":225,"sheet":"3254 PK000341"},{"id":"3111 A640","rearSpeed":50,"rearPulse":35,"rearInterval":3,"frontSpeed":75,"frontAmp":70,"count":105,"dischargeTime":50,"precount":52,"dischargeIntervals":0,"maxReject":5,"dischargeMode":1,"channelWidth":215,"precountFlap":45,"overcount":2,"dosingSpeed":180,"modules":4,"dosingStartPos":65,"ejector":0,"dosingStartSpeed":1000,"ionizer":1,"upsideSensor":0,"bpm":60,"diameter":70,"speedBalance":0,"screwHeight":120,"beltSpeed":110,"screwAngle":400,"handlingDischarge":25,"pockets":8,"gateOpen":300,"gateClose":170,"sideSensor":310,"funnel":0,"fg":"3111","bulk":"A640","line":10,"size":225,"sheet":"3111 A640"},{"id":"1416 A420","rearSpeed":50,"rearPulse":35,"width":20,"rearInterval":3,"transparent":1,"frontSpeed":75,"frontAmp":70,"count":60,"dischargeTime":40,"precount":30,"dischargeIntervals":0,"maxReject":5,"dischargeMode":1,"channelWidth":215,"overcount":5,"dosingSpeed":180,"modules":4,"dosingStartPos":65,"ejector":0,"dosingStartSpeed":1000,"ionizer":1,"upsideSensor":0,"bpm":60,"diameter":70,"speedBalance":0,"screwHeight":120,"beltSpeed":110,"screwAngle":400,"handlingDischarge":25,"pockets":8,"gateOpen":300,"gateClose":170,"sideSensor":310,"funnel":0,"fg":"1416","bulk":"A420","line":10,"size":225,"sheet":"1416 A420"},{"id":"1486 A410","rearSpeed":50,"length":15,"rearPulse":25,"width":80,"rearInterval":3,"transparent":0,"frontSpeed":75,"frontAmp":75,"count":250,"dischargeTime":50,"precount":125,"dischargeIntervals":0,"maxReject":5,"dischargeMode":1,"channelWidth":215,"precountFlap":125,"overcount":5,"dosingSpeed":145,"modules":4,"dosingStartPos":60,"ejector":0,"dosingStartSpeed":1000,"ionizer":1,"upsideSensor":0,"bpm":60,"diameter":70,"speedBalance":0,"screwHeight":120,"beltSpeed":110,"screwAngle":400,"handlingDischarge":25,"pockets":8,"gateOpen":300,"gateClose":170,"sideSensor":310,"funnel":0,"fg":"1486","bulk":"A410","line":10,"size":225,"sheet":"1486  A410"}]};
const FIELDS = DATA.fields.filter(f=>f.key!=='id'), R = DATA.recipes;
const GROUPS = [...new Set(FIELDS.map(f=>f.group))];
const TOGGLES = new Set(['transparent','ejector','ionizer','upsideSensor']);
const KEYS = [['count','Count'],['precount','Precount'],['bpm','Bottles/min'],['dosingSpeed','Dosing speed']];
const COLORS = {'9-225':'--c-g','9-300':'--c-y','9-400':'--c-b','9-500':'--c-p','10-150':'--c-g','10-225':'--c-v'};
const PAPER = {'9-225':'Green','9-300':'Yellow','9-400':'Blue','9-500':'Pink','10-150':'Green','10-225':'Purple'};
const col = r => `var(${COLORS[r.line+'-'+r.size]})`;
const nat = (a,b) => a.localeCompare(b,undefined,{numeric:true});
R.forEach((r,i)=>{ r.uid=i; r.hay=[r.id,r.fg,r.bulk,r.sheet].join(' ').toLowerCase(); });
R.sort((a,b)=>nat(a.fg,b.fg)||a.line-b.line||a.size-b.size).forEach((r,i)=>r.order=i);
const byUid = Object.fromEntries(R.map(r=>[r.uid,r]));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank = v => v===undefined||v===null||v==='';
const text = (k,v) => blank(v)?'—':(TOGGLES.has(k)&&(v===0||v===1)?(v?'ON':'OFF'):String(v));
const html = (k,v) => blank(v)?'<span class="v blank">—</span>':(TOGGLES.has(k)&&(v===0||v===1)?`<span class="on-off ${v?'on':'off'}">${v?'ON':'OFF'}</span>`:`<span class="v">${esc(v)}</span>`);
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),1600); }
const store = { get(k,d){try{const v=localStorage.getItem('cremer.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem('cremer.'+k,JSON.stringify(v))}catch(e){}} };

/* theme */
const th = store.get('theme',null); if (th) document.documentElement.dataset.theme = th;
$('#theme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.dataset.theme = cur==='dark'?'light':'dark'; store.set('theme',document.documentElement.dataset.theme);
};

/* filters: one row — lines, then the bottle sizes of that line */
const state = { q:'', line:'all', size:'all', limit:60 };
function renderFilters(){
  const lines = [['all','All lines'],['9','Line 9'],['10','Line 10']];
  const groups = [...new Set(R.filter(r=>state.line==='all'||r.line==state.line).map(r=>r.line+'-'+r.size))]
    .sort((a,b)=>{const [la,sa]=a.split('-').map(Number),[lb,sb]=b.split('-').map(Number);return la-lb||sa-sb;});
  $('#filters').innerHTML =
    lines.map(([v,l])=>`<button class="chip ${state.line===v?'on':''}" data-line="${v}">${l}</button>`).join('') +
    '<span class="sep"></span>' +
    groups.map(g=>{const [l,s]=g.split('-');return `<button class="chip ${state.size===g?'on':''}" data-size="${g}"><span class="dot" style="background:var(${COLORS[g]})"></span>${s}cc${state.line==='all'?` <span style="opacity:.6;font-weight:500">L${l}</span>`:''}</button>`;}).join('');
}
$('#filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if (b.dataset.line){ state.line=b.dataset.line; state.size='all'; }
  if (b.dataset.size){ state.size = state.size===b.dataset.size?'all':b.dataset.size; }
  state.limit=60; renderFilters(); render();
});
let qt;
$('#q').addEventListener('input', e => { $('#sw').classList.toggle('has',!!e.target.value); clearTimeout(qt); qt=setTimeout(()=>{state.q=e.target.value;state.limit=60;render();},80); });
$('#clear').onclick = e => { e.preventDefault(); $('#q').value=''; $('#sw').classList.remove('has'); state.q=''; render(); $('#q').focus(); };

/* results */
function hl(s,toks){ s=esc(s); if(!toks.length) return s; return s.replace(new RegExp('('+toks.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'),'<mark>$1</mark>'); }
function render(){
  const toks = state.q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const list = R.filter(r=>(state.line==='all'||r.line==state.line)&&(state.size==='all'||state.size===r.line+'-'+r.size)&&toks.every(t=>r.hay.includes(t)));
  if (toks.length) list.sort((a,b)=>{const ex=r=>toks.includes(r.fg.toLowerCase())||toks.includes(r.bulk.toLowerCase());return ex(b)-ex(a)||a.order-b.order;});
  $('#count').textContent = list.length===R.length ? `${R.length} recipes` : `${list.length} of ${R.length} recipes`;
  if (!list.length){ $('#results').innerHTML=`<div class="empty"><b>No recipe found.</b><br>Try only the FG number or the bulk code, or choose “All lines”.</div>`; return; }
  const shown = list.slice(0,state.limit);
  $('#results').innerHTML = `<div class="list">${shown.map((r,i)=>`
    <button class="row" data-u="${r.uid}" style="--sc:${col(r)};animation-delay:${Math.min(i,15)*15}ms">
      <span class="main"><span class="fg">${hl(r.fg,toks)}</span><br><span class="bulk">${hl(r.bulk||'—',toks)}</span></span>
      <span class="meta"><span class="dot"></span>Line ${r.line} · ${r.size} cc</span>
    </button>`).join('')}</div>` + (list.length>shown.length?`<button class="more" id="more">Show ${list.length-shown.length} more</button>`:'');
  const m=$('#more'); if(m) m.onclick=()=>{state.limit=1e9;render();};
}
$('#results').addEventListener('click', e => { const r=e.target.closest('.row'); if(r) open(+r.dataset.u); });

/* detail panel */
const cmp = [];
function open(uid){
  const r = byUid[uid];
  const others = R.filter(x=>x.uid!==uid&&x.fg===r.fg);
  let h = `<div class="p-head" style="--sc:${col(r)}"><div class="p-top">
      <div><div class="p-fg">${esc(r.fg)}</div><div class="p-bulk">${esc(r.bulk)}</div></div>
      <button class="ghost" id="pClose" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div><span class="tag"><span class="dot"></span>Line ${r.line} · ${r.size} cc · ${PAPER[r.line+'-'+r.size]} sheet</span></div>
    <div class="p-body">
    <div class="keys">${KEYS.map(([k,l])=>`<div class="key"><b class="num">${esc(text(k,r[k]))}</b><span>${l}</span></div>`).join('')}</div>`;
  GROUPS.forEach(g=>{
    h += `<div class="sec"><h3>${esc(g)}</h3><div class="box">${FIELDS.filter(f=>f.group===g).map(f=>`<div class="kv"><span class="k">${esc(f.label)}</span>${html(f.key,r[f.key])}</div>`).join('')}</div></div>`;
  });
  if (others.length) h += `<div class="sec"><h3>Same FG, other recipe</h3><div class="also">${others.map(x=>`<button class="chip" data-go="${x.uid}"><span class="dot" style="background:${col(x)}"></span>Line ${x.line} · ${x.size}cc${x.bulk!==r.bulk?' · '+esc(x.bulk):''}</button>`).join('')}</div></div>`;
  h += `<div class="note">Workbook sheet: “${esc(r.sheet)}”</div></div>
    <div class="p-foot"><button class="btn primary" id="pCopy">Copy</button><button class="btn" id="pCmp">${cmpLabel(uid)}</button><button class="btn" id="pPrint">Print</button></div>`;
  const p=$('#panel'); p.innerHTML=h; p.classList.add('show'); p.setAttribute('aria-hidden','false'); $('#scrim').classList.add('show');
  $('#pClose').onclick=close; $('#pPrint').onclick=()=>print(); $('#pCopy').onclick=()=>copy(r);
  $('#pCmp').onclick=()=>{ if(cmp.includes(uid)&&cmp.length>1){ openCmp(); return; } if(!cmp.includes(uid)) toggleCmp(uid); $('#pCmp').textContent=cmpLabel(uid); };
  p.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open(+b.dataset.go));
}
function close(){ $('#panel').classList.remove('show'); $('#panel').setAttribute('aria-hidden','true'); if(!$('#modal').classList.contains('show')) $('#scrim').classList.remove('show'); }
$('#scrim').onclick=()=>{ closeModal(); close(); };
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('#modal').classList.contains('show')) closeModal(); else close(); }
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){ e.preventDefault(); $('#q').focus(); }
});
function copy(r){
  let t=`${r.fg} ${r.bulk} — Line ${r.line}, ${r.size}cc\n`;
  GROUPS.forEach(g=>{ t+=`\n${g}\n`; FIELDS.filter(f=>f.group===g).forEach(f=>t+=`  ${f.label}: ${text(f.key,r[f.key])}\n`); });
  const ok=()=>toast('Copied'), fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok();}catch(e){toast('Copy not available');}a.remove();};
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(ok,fb); else fb();
}

/* compare */
function toggleCmp(uid){
  const i=cmp.indexOf(uid);
  if(i>=0) cmp.splice(i,1); else { if(cmp.length>=4){toast('Up to 4 recipes');return;} cmp.push(uid); toast('Added to compare'); }
  $('#tray').classList.toggle('show',cmp.length>0);
  $('#trayT').textContent = cmp.length===1?'1 picked — add another':`${cmp.length} recipes picked`;
  $('#trayGo').style.display = cmp.length>1?'':'none';
  if($('#modal').classList.contains('show')){ cmp.length>1?renderCmp():closeModal(); }
}
$('#trayX').onclick=()=>{ cmp.splice(0); $('#tray').classList.remove('show'); };
function openCmp(){ close(); renderCmp(); $('#modal').classList.add('show'); $('#scrim').classList.add('show'); }
$('#trayGo').onclick=openCmp;
function cmpLabel(uid){ return !cmp.includes(uid) ? '+ Compare' : cmp.length>1 ? `View compare (${cmp.length})` : '✓ Added — pick another'; }
function closeModal(){ $('#modal').classList.remove('show'); if(!$('#panel').classList.contains('show')) $('#scrim').classList.remove('show'); }
$('#mClose').onclick=closeModal; $('#onlyDiff').onchange=renderCmp;
function renderCmp(){
  const rs=cmp.map(u=>byUid[u]), only=$('#onlyDiff').checked; let body='', n=0;
  GROUPS.forEach(g=>{
    const rows=FIELDS.filter(f=>f.group===g).map(f=>{ const d=new Set(rs.map(r=>text(f.key,r[f.key]))).size>1; if(only&&!d) return ''; n++;
      return `<tr class="${d?'d':''}"><td>${esc(f.label)}</td>${rs.map(r=>`<td class="num">${html(f.key,r[f.key])}</td>`).join('')}</tr>`; }).join('');
    if(rows) body+=`<tr class="g"><td colspan="${rs.length+1}">${esc(g)}</td></tr>`+rows;
  });
  if(!n) body=`<tr><td colspan="${rs.length+1}" style="text-align:center;padding:28px">All settings are the same.</td></tr>`;
  $('#mBody').innerHTML=`<table><thead><tr><th></th>${rs.map(r=>`<th style="box-shadow:inset 0 3px 0 ${col(r)}"><span class="f">${esc(r.fg)}</span><span class="s">${esc(r.bulk)} · L${r.line} · ${r.size}cc</span><br><button class="rm" data-rm="${r.uid}">remove</button></th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
}
$('#mBody').addEventListener('click',e=>{const b=e.target.closest('[data-rm]'); if(b) toggleCmp(+b.dataset.rm);});

renderFilters(); render();
</script>
</body>
</html>
