<style>
:root{
  --side:300px; --side-now:var(--side);
  --bg:#f6f7fb; --glass:#ffffff; --card:#ffffff; --ink:#171a24; --ink2:#5b6172; --ink3:#9399a8; --line:#e5e7ee;
  --g1:#2563eb; --g2:#2563eb; --g3:#2563eb; --grad:var(--g1);
  --blob1:#c4b5fd; --blob2:#fbcfe8; --blob3:#a5f3fc; --blob4:#fde68a;
  --c-g:#10b981; --c-y:#eab308; --c-b:#3b82f6; --c-p:#ec4899; --c-v:#8b5cf6;
  --c-75:#0d9488; --c-150:#ea580c; --c-625:#dc2626; --c-750:#475569; --c-950:#a16207;
  --warn:#b45309; --warn-bg:#fef3c7; --k1:var(--ink); --k2:var(--ink); --k3:var(--ink); --k4:var(--ink); --ok:#059669; --diff:#fff4d4;
  --shadow:0 1px 2px rgba(20,20,40,.04),0 6px 18px rgba(20,20,40,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101218; --glass:#181b23; --card:#181b23; --ink:#eef0f5; --ink2:#aab0be; --ink3:#727989; --line:#2a2e39;
  --g1:#3b82f6; --g2:#3b82f6; --g3:#3b82f6;
  --blob1:#4c1d95; --blob2:#831843; --blob3:#155e75; --blob4:#713f12;
  --warn:#fbbf24; --warn-bg:#3a2e10; --k1:var(--ink); --k2:var(--ink); --k3:var(--ink); --k4:var(--ink); --ok:#34d399; --diff:#3a3214;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#101218; --glass:#181b23; --card:#181b23; --ink:#eef0f5; --ink2:#aab0be; --ink3:#727989; --line:#2a2e39;
  --g1:#3b82f6; --g2:#3b82f6; --g3:#3b82f6;
  --blob1:#4c1d95; --blob2:#831843; --blob3:#155e75; --blob4:#713f12;
  --warn:#fbbf24; --warn-bg:#3a2e10; --k1:var(--ink); --k2:var(--ink); --k3:var(--ink); --k4:var(--ink); --ok:#34d399; --diff:#3a3214;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;overflow-x:clip}
html{overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}

/* colourful animated background */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;width:52vmax;height:52vmax;border-radius:50%;filter:blur(70px);opacity:.75;animation:drift 22s ease-in-out infinite alternate}
.bgfx i:nth-child(1){background:var(--blob1);top:-22vmax;left:-14vmax}
.bgfx i:nth-child(2){background:var(--blob2);top:-18vmax;right:-18vmax;animation-delay:-6s}
.bgfx i:nth-child(3){background:var(--blob3);bottom:-28vmax;left:8vmax;animation-delay:-11s}
.bgfx i:nth-child(4){background:var(--blob4);bottom:-30vmax;right:-10vmax;opacity:.5;animation-delay:-16s}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.12)}}

.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* header */
header{position:relative;text-align:center;padding:38px 46px 20px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink2);animation:fade .5s both}
.badge b{width:8px;height:8px;border-radius:50%;background:var(--g1)}
h1{margin:12px 0 4px;font-size:clamp(28px,5.5vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.05;color:var(--ink);animation:fade .5s .05s both}
@keyframes shine{to{background-position:200% center}}
.sub{color:var(--ink2);font-size:15px;animation:fade .5s .1s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.iconbtn{border:1px solid var(--line);background:var(--glass);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);transition:transform .15s;flex:none}
.iconbtn:hover{transform:rotate(-12deg)}
.iconbtn:active{transform:scale(.9)}
header .iconbtn{position:absolute;right:0;top:34px}

/* search + filters */
.sticky{position:sticky;top:0;z-index:5;padding:8px 0 12px}
.sticky::before{content:"";position:absolute;inset:0 calc(50% - 50vw);background:var(--glass);border-bottom:1px solid var(--line);z-index:-1;opacity:0;transition:opacity .2s}
.sticky.stuck::before{opacity:1}
.search{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--glass);border-radius:18px;padding:0 18px;box-shadow:var(--shadow);position:relative;border:1px solid var(--line);animation:fade .5s .15s both}
.search::after{content:"";position:absolute;inset:-2px;border-radius:20px;padding:2px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .2s;pointer-events:none}
.search:focus-within::after{opacity:1}
.search .sicon{flex:none;width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:17px;padding:16px 0}
.search input::placeholder{color:var(--ink3)}
.search input::-webkit-search-cancel-button{display:none}
.clear{border:0;background:var(--line);width:26px;height:26px;border-radius:50%;display:none;place-items:center;color:var(--ink2)}
.search.has .clear{display:grid}
.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px;animation:fade .5s .2s both}
.sep{flex-basis:100%;height:0}
.chip{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:7px 15px;font-size:14px;font-weight:700;color:var(--ink2);display:inline-flex;align-items:center;gap:7px;transition:transform .15s,background .2s,color .2s,box-shadow .2s}
.chip:hover{transform:translateY(-2px)}
.chip:active{transform:scale(.94)}
.chip.line.on{background:var(--g1);color:#fff;border-color:var(--g1)}
.chip.size{--c:var(--g1)}
.chip.size.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.size small{opacity:.7;font-weight:600}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}

/* results */
.count{text-align:center;color:var(--ink2);font-size:13.5px;margin:6px 0 14px;font-weight:600}
.count b{color:var(--ink);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,196px));justify-content:center;gap:14px}
.card{--c:var(--g1);position:relative;overflow:hidden;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:20px 14px 16px;text-align:center;box-shadow:var(--shadow);transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s;animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(20,20,40,.12)}
.card:active{transform:translateY(-2px) scale(.98)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.card .fg{position:relative;font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.card .bulk{position:relative;color:var(--ink2);font-weight:600;font-size:14px;margin-top:3px}
.card .tag{position:relative;display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:4px 11px;border-radius:999px;background:var(--bg);color:var(--ink2);font-size:12px;font-weight:700}
.card .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.card .mini{position:relative;display:flex;justify-content:center;gap:12px;margin-top:12px;font-size:12px;color:var(--ink3);font-weight:600}
.card .mini b{color:var(--ink);font-size:14px}
mark{background:none;color:var(--g1);text-decoration:underline 3px;text-underline-offset:3px}
.empty{grid-column:1/-1;text-align:center;padding:50px 16px;color:var(--ink2)}
.empty .e{font-size:48px;display:block;margin-bottom:8px;animation:wob 2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-10deg) scale(1.1)}}
.more{display:block;margin:18px auto 0;border:0;background:var(--grad);color:#fff;border-radius:999px;padding:10px 22px;font-weight:700;transition:transform .15s}
.more:active{transform:scale(.95)}
footer{text-align:center;color:var(--ink3);font-size:12.5px;padding:34px 16px 100px}

/* detail panel */
.scrim{position:fixed;inset:0;background:rgba(10,12,24,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.panel{--c:var(--g1);position:fixed;left:50%;top:50%;width:min(560px,calc(100% - 32px));max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);background:var(--bg);z-index:21;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.28);opacity:0;visibility:hidden;transform:translate(-50%,-46%) scale(.96);transition:opacity .22s,transform .28s cubic-bezier(.2,.8,.2,1),visibility .28s}
.panel.show{opacity:1;visibility:visible;transform:translate(-50%,-50%)}
.panel .p-head,.panel .p-foot{flex:none}.panel .p-body{min-height:0}
.p-head{position:relative;overflow:hidden;padding:24px 20px 18px;text-align:center;background:var(--card);border-bottom:1px solid var(--line);border-top:5px solid var(--c)}
.p-head .iconbtn{position:absolute;right:14px;top:14px;z-index:2}
.p-fg{position:relative;font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:1}
.p-bulk{position:relative;font-weight:600;font-size:16px;color:var(--ink2);margin-top:4px}
.p-tag{position:relative;display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:5px 12px;border-radius:999px;background:var(--bg);color:var(--ink2);font-size:13px;font-weight:700}
.p-tag::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.p-body{flex:1;overflow:auto;padding:18px 18px 30px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 18px}
.key{--k:var(--k1);background:var(--card);border-radius:14px;padding:12px 6px;text-align:center;border:1px solid var(--line);animation:pop .4s both}
.key b{display:block;font-size:24px;font-weight:900;color:var(--k)}
.key span{font-size:11.5px;color:var(--ink2);font-weight:700}
.key:nth-child(2){--k:var(--k2);animation-delay:.05s}.key:nth-child(3){--k:var(--k3);animation-delay:.1s}.key:nth-child(4){--k:var(--k4);animation-delay:.15s}
.sec{--s:var(--g1);margin-bottom:14px;animation:fade .35s both}
.sec h3{margin:0 0 7px 4px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.box{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);transition:background .15s}
.kv:first-child{border-top:0}
.kv:hover{background:var(--bg)}
.kv .k{color:var(--ink2);font-size:14px}
.kv .v{font-weight:800;font-variant-numeric:tabular-nums;font-size:15.5px}
.v.blank{color:var(--ink3);font-weight:400}
.on-off{font-size:11.5px;font-weight:800;letter-spacing:.05em;padding:3px 10px;border-radius:999px}
.on-off.on{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.on-off.off{background:var(--line);color:var(--ink3)}
.also{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.note{color:var(--ink3);font-size:12.5px;margin-top:6px;text-align:center}
.p-foot{display:flex;gap:8px;padding:12px 16px;background:var(--glass);border-top:1px solid var(--line)}
.btn{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-weight:700;font-size:14px;transition:transform .12s,box-shadow .2s;position:relative;overflow:hidden}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--g1);border-color:var(--g1);color:#fff}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}


/* ---------- sleek homepage: top bar, hero, cards ---------- */
body{background:radial-gradient(1100px 420px at 50% -160px,color-mix(in srgb,var(--g1) 14%,transparent),transparent 70%) no-repeat,var(--bg)}
header.topbar{position:sticky;top:0;z-index:20;padding:0;text-align:left;color:#f8fafc;background:#0d1322;
  border-bottom:1px solid rgba(255,255,255,.07)}
.tb-in{max-width:1080px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:12px}
.tb-brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.tb-tile{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#141c2f;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
.tb-mark{width:36px;height:36px}
.tb-text{display:flex;align-items:center;gap:12px;min-width:0}
.tb-name{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;font-size:25px;font-weight:800;line-height:1;letter-spacing:-.035em;color:#fff;white-space:nowrap}
.tb-name span{background:linear-gradient(180deg,#fef08a 0%,#facc15 45%,#f59e0b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(250,204,21,.38));padding-right:.04em}
.tb-sub{padding-left:12px;border-left:1px solid rgba(255,255,255,.18);font-size:14px;font-weight:600;letter-spacing:.01em;color:#cbd5e1;white-space:nowrap}
header.topbar .tabs{margin:0;padding:3px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);box-shadow:none}
header.topbar .tabs button{color:#cbd5e1;padding:7px 14px;font-size:14px}
header.topbar .tabs button:hover{color:#fff}
header.topbar .tabs button.on{background:#f8fafc;color:#0b1120}
header.topbar .iconbtn{position:static;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1);color:#e2e8f0;}
.hero{text-align:center;padding:52px 0 18px;animation:fade .5s both}
.hero h1{margin:0;font-size:clamp(32px,6vw,50px);font-weight:700;letter-spacing:-.035em;line-height:1.06;color:var(--ink)}
.hero h1 span{color:var(--g1)}
.hero p{margin:14px 0 0;color:var(--ink2);font-size:15px}
.hero p span{color:var(--ink);font-weight:700}
.sticky{top:58px}
.search{border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06)}
.search .sicon{border-radius:10px}
.card{border-radius:16px;box-shadow:none;padding:22px 14px 16px}
.card::before{height:3px}
.card{content-visibility:auto;contain-intrinsic-size:auto 200px}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(15,23,42,.10);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.card .fg{font-size:23px;font-weight:800;letter-spacing:-.03em}
.card .tag{margin-top:12px;font-weight:600}
.card .mini{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
#viewManage{padding-top:30px}
@media (max-width:560px){
  .tb-in{padding:8px 12px;gap:8px}
  .tb-tile{width:36px;height:36px;border-radius:10px}.tb-mark{width:31px;height:31px}
  .tb-text{flex-direction:column;align-items:flex-start;gap:3px}
  .tb-name{font-size:20px}
  .tb-sub{padding:0;border:0;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#fde68a}
  header.topbar .tabs button{padding:6px 10px;font-size:13px}
  header.topbar .iconbtn{width:32px;height:32px}
  .hero{padding:34px 0 12px}.hero p{font-size:14px}
  .sticky{top:50px}
  /* one sideways-scrolling row of filter chips on phones */
  .filters{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;margin:12px -16px 0;padding:0 16px 4px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent)}
  .filters::-webkit-scrollbar{display:none}
  .filters .sep{flex:0 0 1px;height:auto;background:var(--line);margin:4px 2px}
  .filters .chip{flex:none}
}

/* LineUp wordmark "Rising caps" (Archivo Black; U and P step up) — drawn as shapes, no font needed */
.tb-wordmark{display:block;height:25px;width:auto;color:#fff;overflow:visible}
.intro-wordmark{display:block;height:clamp(46px,12vw,72px);width:auto;color:#f8fafc;margin:6px auto 10px;overflow:visible}
@media (max-width:560px){ .tb-wordmark{height:20px} }
@media (max-width:380px){ .tb-wordmark{height:16px} }

/* "Updated …" row on cards */
.card .upd{position:relative;margin-top:9px;font-size:11.5px;font-weight:600;color:var(--ink3)}
.card .upd.recent{color:var(--g1)}
.card .upd.recent::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--g1);margin-right:5px;vertical-align:1px}
.note b{color:var(--ink2)}
/* update history panel */
.hist{display:none;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;text-align:left}
.h-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px 11px;border-bottom:1px solid var(--line)}

/* ---------- Intro (same as LineUp): plays when the app is opened ---------- */
/* Timeline (seconds): 0.00 belt draws in · 0.10-1.00 bottles ride in ·
   0.95-1.35 cap drops · 1.15 "Welcome to" · 1.30 name and ready ring ·
   2.60 fades into the app. */
.intro-splash {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 16px;
  background: radial-gradient(circle at 50% 58%, #1e3a8a 0%, #0f172a min(75vw, 520px));
  color: #f8fafc;
  cursor: pointer;
  overflow: hidden;
}
.intro-stage {
  width: 100%;
  max-width: 540px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.intro-welcome {
  font-size: clamp(18px, 5vw, 26px);
  font-weight: 600;
  letter-spacing: 0.4px;
  color: #fde047;
}
.intro-name {
  font-family: "Barlow Semi Condensed", "Segoe UI", system-ui, sans-serif;
  font-size: clamp(42px, 11vw, 64px);
  font-weight: 700;
  letter-spacing: 0.5px;
  line-height: 1.1;
}
.intro-up {
  color: #facc15;
}
.intro-tag {
  font-size: clamp(13px, 3.6vw, 16px);
  color: #94a3b8;
  text-align: center;
}
.intro-scene {
  width: 100%;
  height: auto;
  display: block;
  margin-top: 6px;
}
.intro-skip {
  font-size: 12px;
  letter-spacing: 0.3px;
  color: #94a3b8;
  margin-top: 4px;
}
.intro-belt {
  fill: #1e293b;
  stroke: #334155;
  stroke-width: 1.5;
}
.intro-track {
  fill: none;
  stroke: #334155;
  stroke-width: 2;
  stroke-dasharray: 10 12;
}
.intro-leg {
  fill: #475569;
}
.intro-roller {
  fill: #475569;
  stroke: #334155;
  stroke-width: 1.5;
}
.intro-spoke {
  stroke: #1e293b;
  stroke-width: 2;
}
.intro-glass {
  fill: url(#intro-glass);
  stroke: #c98142;
  stroke-opacity: 0.5;
  stroke-width: 1;
}
.intro-shine {
  fill: #ffffff;
  opacity: 0.5;
}
.intro-spec {
  fill: #ffffff;
  opacity: 0.75;
}
.intro-label {
  fill: #fde047;
  stroke: #ca8a04;
  stroke-opacity: 0.35;
  stroke-width: 0.75;
}
.intro-cap {
  fill: #facc15;
}
.intro-ridge {
  stroke: #ca8a04;
  stroke-width: 1.5;
}
.intro-ring {
  fill: none;
  stroke: #4ade80;
  stroke-width: 2.5;
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
}
.intro-roller-spin {
  transform-box: fill-box;
  transform-origin: center;
}
.intro-splash .intro-belt-group {
  animation: intro-belt-in 0.3s ease-out both;
  transform-origin: 240px 198px;
}
.intro-splash .intro-slide {
  animation: intro-slide-in 0.9s cubic-bezier(0.16, 0.84, 0.3, 1) 0.1s both;
}
.intro-splash .intro-track {
  animation: intro-belt-run 0.9s cubic-bezier(0.16, 0.84, 0.3, 1) 0.1s both;
}
.intro-splash .intro-roller-spin {
  animation: intro-spin 0.9s cubic-bezier(0.16, 0.84, 0.3, 1) 0.1s both;
}
.intro-splash .intro-cap-drop {
  animation: intro-cap-drop 0.4s 0.95s both;
}
.intro-splash .intro-ring {
  animation: intro-ring 0.6s ease-out 1.3s;
}
.intro-splash .intro-welcome {
  animation: intro-rise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) 1.15s both;
}
.intro-splash .intro-name {
  animation: intro-rise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) 1.3s both;
}
.intro-splash .intro-tag {
  animation: intro-rise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) 1.45s both;
}
.intro-splash .intro-skip {
  animation: intro-fade-in 0.4s ease 0.5s both;
}
.intro-splash.leaving {
  animation: intro-out 0.45s ease forwards;
}
.intro-splash.leaving .intro-stage {
  animation: intro-grow 0.45s ease forwards;
}
.intro-splash.skipping {
  animation: intro-out 0.2s ease forwards;
}
@keyframes intro-belt-in {
  from {
    transform: scaleX(0);
    opacity: 0;
  }
}
@keyframes intro-slide-in {
  from {
    transform: translateX(-340px);
  }
}
@keyframes intro-belt-run {
  from {
    stroke-dashoffset: 340;
  }
  to {
    stroke-dashoffset: 0;
  }
}
@keyframes intro-spin {
  from {
    transform: rotate(-2435deg);
  }
  to {
    transform: rotate(0deg);
  }
}
@keyframes intro-cap-drop {
  0% {
    transform: translateY(-120px);
    opacity: 0;
    animation-timing-function: cubic-bezier(0.5, 0, 1, 1);
  }
  20% {
    opacity: 1;
  }
  65% {
    transform: translateY(0);
    animation-timing-function: ease-out;
  }
  80% {
    transform: translateY(-7px);
    animation-timing-function: ease-in;
  }
  100% {
    transform: translateY(0);
    opacity: 1;
  }
}
@keyframes intro-ring {
  0% {
    opacity: 0.9;
    transform: scale(0.5);
  }
  100% {
    opacity: 0;
    transform: scale(1.7);
  }
}
@keyframes intro-rise {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
}
@keyframes intro-fade-in {
  from {
    opacity: 0;
  }
}
@keyframes intro-out {
  to {
    opacity: 0;
  }
}
@keyframes intro-grow {
  to {
    transform: scale(1.04);
  }
}

.intro-splash .intro-sub{animation:intro-rise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) 1.45s both}
.intro-splash{display:none!important}

@page{size:auto;margin:12mm 12mm 10mm}
@media print{
  .ps{color:#14161d;font-size:12px}
  .ps-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:10px;border-bottom:1px solid #d9dce3}
  .ps-kicker{font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8a90a0;margin-bottom:4px}
  .ps-fg{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:.95}
  .ps-bulk{font-size:17px;font-weight:600;color:#5b6172;margin-left:12px}
  .ps-size{text-align:right}
  .ps-pill{display:inline-block;background:var(--c);color:#fff;font-weight:800;font-size:13px;padding:6px 14px;border-radius:999px}
  .ps-paper{display:block;margin-top:4px;font-size:10px;color:#8a90a0;font-weight:600}
  .ps-meta{display:grid;grid-template-columns:1.3fr 1fr 1.3fr;gap:16px;margin:10px 0 2px}
  .ps-meta div{border-bottom:1.5px solid #14161d;padding-bottom:3px}
  .ps-meta span{display:block;font-size:8.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8a90a0}
  .ps-meta b{display:block;font-size:14px;min-height:22px;padding-top:4px}
  .ps-h{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin:11px 0 4px;padding-bottom:3px;border-bottom:2px solid #14161d}
  .ps-h::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
  .ps-tab{width:100%;border-collapse:collapse}
  .ps-tab th{text-align:left;font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#8a90a0;padding:3px 8px;border-bottom:1px solid #d9dce3}
  .ps-tab td{padding:4px 8px;border-bottom:1px solid #eceef2;font-size:13px}
  .ps-tab .r{text-align:right}
  .ps-tab td.g{color:#8a90a0;font-size:11px}
  .ps-tab td.cur{color:#8a90a0;text-decoration:line-through}
  .ps-tab td.new span{display:inline-block;font-weight:900;font-size:15px;padding:1px 10px;border-radius:7px;background:color-mix(in srgb,var(--c) 16%,#fff)}
  .ps-note{min-height:36px;border:1px solid #d9dce3;border-radius:8px;padding:8px 10px;font-size:13px;white-space:pre-wrap}
  .ps-cols{columns:2;column-gap:24px}
  .ps-sec{break-inside:avoid;margin-bottom:5px}
  .ps-sec h4{margin:0 0 1px;font-size:8.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#5b6172}
  .ps-kv{display:flex;justify-content:space-between;gap:8px;font-size:10px;padding:1px 5px;border-bottom:1px solid #f0f1f4}
  .ps-kv span{color:#4b5161}.ps-kv b{font-weight:800}
  .ps-kv.chg{background:color-mix(in srgb,var(--c) 16%,#fff);border-radius:4px}
  .ps-kv.chg span{color:#14161d;font-weight:700}
  .ps-kv s{color:#8a90a0;font-weight:400;margin-right:6px}
  .ps-foot{display:flex;justify-content:space-between;gap:16px;margin-top:10px;padding-top:6px;border-top:1px solid #d9dce3;font-size:8.5px;color:#8a90a0}
  .ps.many .ps-tab td{padding:2.5px 8px;font-size:12px}
  .ps.many .ps-tab td.new span{font-size:13.5px;padding:0 8px}
  .ps.many .ps-kv{font-size:9.5px;padding:.5px 5px}
  .ps.many .ps-h{margin:8px 0 3px}
  .ps.many .ps-sec{margin-bottom:3px}
  .ps.lots .ps-cols{columns:3;column-gap:16px}
  .ps.lots .ps-kv{font-size:9px}
  html,body{background:#fff!important;color:#14161d}
  *{animation:none!important;transition:none!important;box-shadow:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bgfx,.topbar,.hist,.hist-fab,.wrap,footer,.scrim,.p-foot,.iconbtn,.toast,.sec.also-sec,.note,.p-tag,.sbanner{display:none!important}
  .print-only{display:block}
  body.print-sugg .panel,body.print-sugg .scrim{display:none!important}
  body.print-sugg .ps{display:block}
  .panel{position:static;transform:none!important;opacity:1;visibility:visible;width:100%;max-height:none;border-radius:0;overflow:visible;background:#fff;display:block}
  /* header */
  .p-head{display:grid;grid-template-columns:1fr auto;align-items:end;gap:4px 16px;text-align:left;padding:0 0 12px;border:0;border-bottom:1px solid #d9dce3;background:#fff}
  .p-kicker{grid-column:1/-1;font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8a90a0}
  .p-name{display:flex;align-items:baseline;gap:12px}
  .p-fg{font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:.95}
  .p-bulk{font-size:18px;font-weight:600;color:#5b6172;margin:0}
  .p-size{text-align:right}
  .p-size .pill{display:inline-block;background:var(--c);color:#fff;font-weight:800;font-size:13px;padding:6px 14px;border-radius:999px}
  .p-size .paper{display:block;margin-top:4px;font-size:10px;color:#8a90a0;font-weight:600}
  /* key numbers */
  .p-body{overflow:visible;padding:14px 0 0}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 16px}
  .key{border:0;border-radius:12px;padding:10px 12px;text-align:left;background:color-mix(in srgb,var(--c) 10%,#fff)}
  .key b{font-size:26px;font-weight:900;color:#14161d;line-height:1.05}
  .key span{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5b6172;margin-top:2px}
  /* settings */
  .p-body{columns:2;column-gap:28px}
  .keys,.p-print-foot{column-span:all}
  .sec{break-inside:avoid;margin:0 0 12px}
  .sec h3{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#14161d;margin:0 0 4px;padding-bottom:4px;border-bottom:2px solid #14161d}
  .sec h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
  .box{border:0;border-radius:0;background:none}
  .kv{padding:4px 2px;border-top:0;border-bottom:1px solid #eceef2}
  .kv:last-child{border-bottom:0}
  .kv .k{font-size:12px;color:#4b5161}.kv .v{font-size:13.5px;font-weight:800;color:#14161d}
  .v.blank{color:#b0b5c0}
  .on-off{font-size:10px;padding:1px 8px;border-radius:999px}
  .on-off.on{background:#dcf5e9!important;color:#08794a}
  .on-off.off{background:#eef0f3!important;color:#8a90a0}
  /* footer */
  .p-print-foot{display:flex;justify-content:space-between;gap:16px;margin-top:6px;padding-top:8px;border-top:1px solid #d9dce3;font-size:9px;color:#8a90a0}
  .p-print-foot b{color:#5b6172}
}
</style>

const PAGE_SRC = (()=>{ const c=document.documentElement.cloneNode(true); c.classList.remove('intro-on','hist-hidden','no-anim'); if(!c.classList.length) c.removeAttribute('class'); return '<!doctype html>\n'+c.outerHTML; })();
/* intro (same as LineUp): 2.6 s, then a 0.45 s fade; a click or any key skips it (0.2 s fade) */
(()=>{ const root=document.documentElement, el=document.getElementById('intro'); if(!el) return;
  if(!root.classList.contains('intro-on')){ el.remove(); return; }
  let t; const end=()=>{ root.classList.remove('intro-on'); el.remove(); removeEventListener('keydown',skip,true); };
  const go=(cls,ms)=>{ clearTimeout(t); el.classList.add(cls); t=setTimeout(end,ms); };
  const skip=e=>{ if(e){ e.preventDefault(); e.stopPropagation(); } if(!el.classList.contains('skipping')&&!el.classList.contains('leaving')) go('skipping',200); };
  t=setTimeout(()=>go('leaving',450),2600); el.addEventListener('click',()=>skip()); addEventListener('keydown',skip,true);
})();
const REV = DATA.rev || 'base';

const ALL_SIZES = [75,150,225,300,400,500,625,750,950];

const SIZE_COLOR = {75:'--c-75',150:'--c-150',225:'--c-g',300:'--c-y',400:'--c-b',500:'--c-p',625:'--c-625',750:'--c-750',950:'--c-950'};
const paperOf = r => PAPER[r.line+'-'+r.size] ? PAPER[r.line+'-'+r.size]+' sheet' : '';
const colVar = (line,size) => COLORS[line+'-'+size] || SIZE_COLOR[size] || '--g1';
const col = r => `var(${colVar(r.line,r.size)})`;
const nat = (a,b) => String(a).localeCompare(String(b),undefined,{numeric:true});
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank = v => v===undefined||v===null||v==='';
const text = (k,v) => blank(v)?'—':(TOGGLES.has(k)&&(v===0||v===1)?(v?'ON':'OFF'):String(v));
const html = (k,v) => blank(v)?'<span class="v blank">—</span>':(TOGGLES.has(k)&&(v===0||v===1)?`<span class="on-off ${v?'on':'off'}">${v?'ON':'OFF'}</span>`:`<span class="v">${esc(v)}</span>`);

const EKEY = 'edits.'+REV;   // a downloaded updated file has a new rev, so it starts clean
const edits = () => { const e=store.get(EKEY,null)||{}; return {added:e.added||[], edited:e.edited||{}, removed:e.removed||[], log:e.log||[]}; };
/* ---- update history: the guide import, plus every change made in Manage ---- */
const GUIDE_DATE = DATA.guideDate || '2026-10-06';   // the Cremer Recipe Guides are dated 10.06.26
const GUIDE_COUNT = DATA.guideCount || DATA.recipes.length;
const fmtDay = iso => new Date(String(iso).length===10 ? iso+'T12:00:00' : iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const allHistory = () => [...(DATA.history||[]).map(h=>({...h,local:false})), ...edits().log.map(h=>({...h,local:true}))].sort((a,b)=>b.at.localeCompare(a.at));
const logChange = (e, entry) => { (e.log=e.log||[]).push({at:new Date().toISOString(), ...entry}); };
const saveEdits = e => store.set(EKEY, e);
const nChanges = e => Object.keys(e.edited).length + e.added.length + e.removed.length;
const RECORD_KEYS = ['id','fg','bulk','line','size','sheet',...FIELDS.map(f=>f.key)];
const clean = r => { const o={}; RECORD_KEYS.forEach(k=>{ if(!blank(r[k])) o[k]=r[k]; }); return o; };
let R=[], byUid={}, byKey={};
function buildRecipes(){
  const e=edits(), list=[];
  DATA.recipes.forEach(r0=>{
    const k=r0.line+'|'+r0.sheet; if (e.removed.includes(k)) return;
    const r = e.edited[k] ? {...e.edited[k]} : {...r0};
    r.k=k; r.status=e.edited[k]?'edited':''; list.push(r);
  });
  e.added.forEach(a=>list.push({...a, status:'new'}));
  list.forEach((r,i)=>{ r.uid=i; r.hay=[r.id,r.fg,r.bulk,r.sheet].join(' ').toLowerCase(); });
  list.sort((a,b)=>nat(a.fg,b.fg)||a.line-b.line||a.size-b.size).forEach((r,i)=>r.order=i);
  const last={}; allHistory().forEach(h=>{ if(!(h.k in last)) last[h.k]=h; });
  list.forEach(r=>{ const h=last[r.k]; r.updated = h && h.action!=='removed' ? h.at : GUIDE_DATE; r.updLocal = !!(h && h.local); });
  R=list; byUid=Object.fromEntries(R.map(r=>[r.uid,r])); byKey=Object.fromEntries(R.map(r=>[r.k,r]));
  $('#badgeT').textContent = `${linesInUse().map(l=>'Line '+l).join(' · ')} · ${R.length} recipes`;
}
const rKey = r => r.k;
const linesInUse = () => [...new Set([9,10,...R.map(r=>+r.line)])].sort((a,b)=>a-b);
const sourceOf = r => r.status==='new' ? 'Added in Manage' : `Cremer Recipe Guide Line ${String(r.k).split('|')[0]} (10.06.26) · sheet “${esc(r.sheet)}”`+(r.status==='edited'?' · edited in Manage':'');

const setUnlocked = v => { try{ v?sessionStorage.setItem('cremer.unlocked','1'):sessionStorage.removeItem('cremer.unlocked'); }catch(e){} };
const canManage = () => !effLock() || unlocked();
const cryptoOk = () => !!(window.crypto && crypto.subtle && window.TextEncoder);
const b64 = { enc: a => btoa(String.fromCharCode.apply(null, new Uint8Array(a))), dec: s => Uint8Array.from(atob(s), c=>c.charCodeAt(0)) };
async function pwHash(pw, saltB64, iter){
  const salt = saltB64 ? b64.dec(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:iter, hash:'SHA-512'}, key, 512);
  return { salt: saltB64 || b64.enc(salt), hash: b64.enc(new Uint8Array(bits)), iter };
}
async function pwMatches(pw, lock){ try{ const h=await pwHash(pw, lock.salt, lock.iter||LOCK_ITER); return h.hash===lock.hash; }catch(e){ return false; } }
function renderLock(el, after){
  el.innerHTML = `<div class="lock-wrap"><div class="lock-card">
    <div class="lock-ico">🔒</div>
    <h2>Manage is locked</h2>
    <p>Enter the password to edit, add or remove recipes — the same one used on the Cremer Excel sheets.</p>
    <form id="unlockForm" class="lock-form" autocomplete="off">
      <input class="inp" id="pwInput" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
      <button class="btn primary grow" id="unlockBtn" type="submit">Unlock</button>
    </form>
    <div class="lock-err" id="pwErr" hidden></div>
    <div class="lock-note">Looking up and printing recipes stays open to everyone; only changing recipes is locked.</div>
  </div></div>`;
  const inp=$('#pwInput');
  $('#unlockForm').onsubmit = async e => {
    e.preventDefault(); const btn=$('#unlockBtn'); btn.disabled=true; btn.textContent='Checking…';
    if (await pwMatches(inp.value, effLock())){ setUnlocked(true); toast('✓ Unlocked'); after(); }
    else { const er=$('#pwErr'); er.hidden=false; er.textContent='Wrong password. Try again.'; btn.disabled=false; btn.textContent='Unlock'; inp.select(); }
  };
  setTimeout(()=>inp.focus({preventScroll:true}),60);
}
function passwordDialog(isChange){
  if (!cryptoOk()){ toast('Needs a modern browser'); return; }
  const wrap=document.createElement('div'); wrap.className='pw-modal';
  wrap.innerHTML = `<div class="pw-box">
    <h2>${isChange?'Change password':'Set a password'}</h2>
    <p>${isChange?'Enter the current password, then the new one.':'Lock the Manage tab. Use the same password as the Cremer Excel sheets.'}</p>
    <form id="pwForm" autocomplete="off">
      ${isChange?`<input class="inp" id="pwCur" type="password" placeholder="Current password" autocomplete="off">`:''}
      <input class="inp" id="pwNew" type="password" placeholder="${isChange?'New password':'Password'}" autocomplete="new-password">
      <input class="inp" id="pwNew2" type="password" placeholder="Repeat password" autocomplete="new-password">
      <div class="lock-err" id="pwDErr" hidden></div>
      <div class="pw-acts"><button type="button" class="btn" id="pwCancel">Cancel</button><button type="submit" class="btn primary grow" id="pwSave">Save</button></div>
    </form>
    <div class="lock-note">Stored only as a salted hash (SHA-512) — never as plain text, the same way Excel locks the sheets.</div>
  </div>`;
  document.body.appendChild(wrap); requestAnimationFrame(()=>wrap.classList.add('show'));
  const done=()=>{ wrap.classList.remove('show'); setTimeout(()=>wrap.remove(),200); };
  wrap.addEventListener('click',e=>{ if(e.target===wrap) done(); });
  $('#pwCancel').onclick=done;
  $('#pwForm').onsubmit = async e => {
    e.preventDefault(); const er=$('#pwDErr'); er.hidden=true;
    const npw=$('#pwNew').value, npw2=$('#pwNew2').value;
    if (npw.length<4){ er.hidden=false; er.textContent='Use at least 4 characters.'; return; }
    if (npw!==npw2){ er.hidden=false; er.textContent='The two passwords don’t match.'; return; }
    if (isChange){ if(!(await pwMatches($('#pwCur').value, effLock()))){ er.hidden=false; er.textContent='Current password is wrong.'; $('#pwCur').select(); return; } }
    const lock = await pwHash(npw, null, LOCK_ITER);
    store.set('lock', lock); setUnlocked(true); done(); showLockLine(lock);
  };
  setTimeout(()=>{ ($('#pwCur')||$('#pwNew')).focus({preventScroll:true}); },60);
}
function showLockLine(lock){
  const line = `const MANAGE_LOCK = ${JSON.stringify(lock)};`;
  const wrap=document.createElement('div'); wrap.className='pw-modal show';
  wrap.innerHTML = `<div class="pw-box">
    <h2>New password ready ✓</h2>
    <p>To use it on <b>every device</b>, paste this line into <b>cremer-recipes.html</b> — replace the line that starts <code>const MANAGE_LOCK</code> — then share the file again:</p>
    <textarea class="inp code" id="lockLine" rows="3" readonly>${esc(line)}</textarea>
    <div class="pw-acts"><button class="btn" id="lockCopy">Copy line</button><button class="btn primary grow" id="lockDone">Done</button></div>
    <div class="lock-note">${MANAGE_LOCK?'The current password is built into this file, so the new one takes effect once that line is pasted in.':'Until you do that, the password works on this device only.'}</div>
  </div>`;
  document.body.appendChild(wrap);
  const done=()=>{ wrap.classList.remove('show'); setTimeout(()=>wrap.remove(),200); renderManage(); };
  $('#lockDone').onclick=done; $('#lockCopy').onclick=()=>{ copyText(line,'✓ Line copied'); $('#lockLine').select(); };
  wrap.addEventListener('click',e=>{ if(e.target===wrap) done(); });
}

/* filters */
const state = { q:'', line:'all', size:'all', limit:48, tab:'recipes', mq:'' };
function renderFilters(){
  const lines = [['all','All lines'], ...linesInUse().map(l=>[String(l),'Line '+l])];
  const groups = [...new Set(R.filter(r=>state.line==='all'||r.line==state.line).map(r=>r.line+'-'+r.size))]
    .sort((a,b)=>{const [la,sa]=a.split('-').map(Number),[lb,sb]=b.split('-').map(Number);return la-lb||sa-sb;});
  $('#filters').innerHTML =
    lines.map(([v,l])=>`<button class="chip line ${state.line===v?'on':''}" data-line="${v}">${l}</button>`).join('') +
    '<span class="sep"></span>' +
    groups.map(g=>{const [l,s]=g.split('-');return `<button class="chip size ${state.size===g?'on':''}" data-size="${g}" style="--c:var(${colVar(l,s)})"><span class="dot"></span>${s}cc${state.line==='all'?` <small>L${l}</small>`:''}</button>`;}).join('');

$('#filters').addEventListener('click', e => {

});
let qt;
$('#q').addEventListener('input', e => { $('#sw').classList.toggle('has',!!e.target.value); clearTimeout(qt); qt=setTimeout(()=>{state.q=e.target.value;state.limit=48;render();},80); });

/* results */
function hl(s,toks){ s=esc(s); if(!toks.length) return s; return s.replace(new RegExp('('+toks.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'),'<mark>$1</mark>'); }
function render(){
  const toks = state.q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const list = R.filter(r=>(state.line==='all'||r.line==state.line)&&(state.size==='all'||state.size===r.line+'-'+r.size)&&toks.every(t=>r.hay.includes(t)));
  if (toks.length) list.sort((a,b)=>{const ex=r=>toks.includes(String(r.fg).toLowerCase())||toks.includes(String(r.bulk).toLowerCase());return ex(b)-ex(a)||a.order-b.order;});
  else list.sort((a,b)=>a.order-b.order);
  $('#count').innerHTML = list.length===R.length ? `<b>${R.length}</b> recipes` : `<b>${list.length}</b> of ${R.length} recipes`;
  if (!list.length){ $('#results').innerHTML=`<div class="grid"><div class="empty"><span class="e">🔎</span><b>No recipe found.</b><br>Try only the FG number or the bulk code, or choose “All lines”.</div></div>`; return; }
  const shown = list.slice(0,state.limit);
  $('#results').innerHTML = `<div class="grid">${shown.map((r,i)=>`
    <button class="card" data-u="${r.uid}" style="--c:${col(r)};animation-delay:${Math.min(i,20)*22}ms">
      <div class="fg">${hl(r.fg,toks)}</div>
      <div class="bulk">${hl(r.bulk||'—',toks)}</div>
      <span class="tag">Line ${r.line} · ${r.size} cc</span>
      <div class="mini"><span>Count <b class="num">${esc(text('count',r.count))}</b></span><span>BPM <b class="num">${esc(text('bpm',r.bpm))}</b></span></div>
      <div class="upd${r.updated!==GUIDE_DATE?' recent':''}">Updated ${esc(fmtDay(r.updated))}</div>
    </button>`).join('')}</div>` + (list.length>shown.length?`<button class="more" id="more">Show ${list.length-shown.length} more</button>`:'');
  const m=$('#more'); if(m) m.onclick=()=>{state.limit=1e9;render();};
}
$('#results').addEventListener('click', e => { const c=e.target.closest('.card'); if(c) open(+c.dataset.u); });

/* recipe window */
const CLOSE_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
function headHtml(r){
  return `<div class="p-head">
      <button class="iconbtn" id="pClose" aria-label="Close">${CLOSE_SVG}</button>
      <div class="p-kicker print-only">LineUp · Cremer Recipes · Counter settings</div>

    <div class="p-print-foot print-only"><span>Source: <b>${sourceOf(r)}</b></span><span>Updated ${esc(fmtDay(r.updated))} · Printed ${new Date().toLocaleDateString()} · Confirm settings on the machine</span></div></div>

function settingControl(f, v, orig){
  const cur=blank(v)?'':String(v), o=blank(orig)?'':String(orig);
  const ctl = TOGGLES.has(f.key)&&(blank(v)||v===0||v===1)&&(blank(orig)||orig===0||orig===1)
    ? `<select class="vin" data-k="${f.key}" data-o="${esc(o)}"><option value=""${cur===''?' selected':''}>—</option><option value="1"${cur==='1'?' selected':''}>ON</option><option value="0"${cur==='0'?' selected':''}>OFF</option></select>`
    : `<input class="vin" data-k="${f.key}" data-o="${esc(o)}" value="${esc(cur)}" inputmode="decimal" placeholder="—" aria-label="${esc(f.label)}">`;
  return `<div class="kv${cur!==o?' chg':''}"><span class="k">${esc(f.label)}</span><span class="ed"><span class="old">${esc(text(f.key,orig))}</span><span class="arrow">→</span>${ctl}</span></div>`;
}
const markChanged = p => p.querySelectorAll('.vin').forEach(i=>i.closest('.kv').classList.toggle('chg', i.value.trim()!==i.dataset.o));

/* "Have better settings?" — change the values you'd use, then print the sheet */
function suggest(uid){
  const r = byUid[uid];
  let h = headHtml(r) + `<div class="p-body">
    <div class="hint"><b>Have better settings?</b> Change the values you think should be different, then print the sheet and give it to your supervisor.</div>
    <label class="field"><span>Your name and shift (Optional)</span><input class="inp" id="sName" maxlength="60" autocomplete="name" placeholder="e.g. Maria, 2nd shift" value="${esc(store.get('name',''))}"></label>`;
  GROUPS.forEach(g=>{ h += `<div class="sec"><h3>${esc(g)}</h3><div class="box">${FIELDS.filter(f=>f.group===g).map(f=>settingControl(f,r[f.key],r[f.key])).join('')}</div></div>`; });
  h += `<label class="field"><span>Why is it better? (optional)</span><textarea class="inp" id="sNote" rows="3" maxlength="500" placeholder="e.g. fewer rejects, bottles stopped jamming at the gate"></textarea></label></div>
    <div class="p-foot"><button class="btn" id="sCancel">Cancel</button><button class="btn primary grow" id="sPrint" disabled>Change a value first</button></div>`;
  const p = showPanel(r,h);
  const changes = () => [...p.querySelectorAll('.vin')].filter(i=>i.value.trim()!==i.dataset.o).map(i=>{
    const f=FIELDS.find(x=>x.key===i.dataset.k);
    return {key:f.key,label:f.label,group:f.group,from:text(f.key,r[f.key]),to:text(f.key,toVal(i.value))};
  });
  const refresh = () => {
    markChanged(p);
    const n=changes().length;
    p.dataset.dirty = n?'1':'';
    $('#sPrint').disabled = !n;
    $('#sPrint').textContent = n ? `🖨 Print ${n} change${n>1?'s':''}` : 'Change a value first';
  };
  const pb=p.querySelector('.p-body'); pb.addEventListener('input', refresh); pb.addEventListener('change', refresh); refresh();
  $('#sCancel').onclick=()=>{ if(!p.dataset.dirty || confirm('Discard your changes?')) open(uid); };
  $('#sPrint').onclick=()=>{
    const ch=changes(); if(!ch.length) return;
    const name=$('#sName').value.trim(); if (name) store.set('name',name);
    printSuggestion(r, ch, name, $('#sNote').value.trim());
  };
  setTimeout(()=>{ const n=$('#sName'); (n.value?p.querySelector('.vin'):n).focus({preventScroll:true}); },60);
}

    </div>
    <div class="ps-meta">
      <div><span>Suggested by</span><b>${name?esc(name):'&nbsp;'}</b></div>
      <div><span>Date</span><b>${esc(new Date().toLocaleDateString())}</b></div>
      <div><span>Approved by / date</span><b>&nbsp;</b></div>
    </div>

    <div class="ps-h">Why it’s better</div>

    <div class="ps-h">Full recipe with the change</div>
    <div class="ps-cols">${GROUPS.map(g=>`<div class="ps-sec"><h4>${esc(g)}</h4>${FIELDS.filter(f=>f.group===g).map(f=>{
        const c = f.key in nv;
        return `<div class="ps-kv${c?' chg':''}"><span>${esc(f.label)}</span><b>${c?`<s>${esc(text(f.key,r[f.key]))}</s>${esc(nv[f.key])}`:esc(text(f.key,r[f.key]))}</b></div>`;
      }).join('')}</div>`).join('')}</div>

  document.body.appendChild(el); document.body.classList.add('print-sugg');
  const done=()=>{ document.body.classList.remove('print-sugg'); removeEventListener('afterprint',done); };

}
function close(force){
  const p=$('#panel');
  if (!force && p.dataset.dirty && !confirm('Discard your changes?')) return false;
  p.dataset.dirty=''; p.classList.remove('show'); p.setAttribute('aria-hidden','true'); $('#scrim').classList.remove('show'); return true;
}
$('#scrim').onclick=()=>close();
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && $('#panel').classList.contains('show')) close();
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); setTab('recipes'); $('#q').focus(); }
});
function copyText(t,msg){
  const ok=()=>toast(msg||'✓ Copied'), fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok();}catch(e){toast('Copy not available');}a.remove();};
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(ok,fb); else fb();
}
function copy(r){
  let t=`${r.fg} ${r.bulk} — Line ${r.line}, ${r.size}cc\n`;
  GROUPS.forEach(g=>{ t+=`\n${g}\n`; FIELDS.filter(f=>f.group===g).forEach(f=>t+=`  ${f.label}: ${text(f.key,r[f.key])}\n`); });
  copyText(t);
}

  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);

    <div class="m-list">${list.slice(0,state.mLimit||60).map(r=>`
      <div class="m-row" style="--c:${col(r)}">
        <span class="dot"></span>
        <div class="m-main"><b>${esc(r.fg)}</b> <span>${esc(r.bulk)}</span><div class="m-sub">Line ${r.line} · ${r.size} cc · updated ${esc(fmtDay(r.updated))}${r.status?` · <em class="m-st ${r.status}">${r.status==='new'?'New':'Edited'}</em>`:''}</div></div>
        <button class="btn" data-medit="${esc(r.k)}">Edit</button>
        <button class="btn danger" data-mdel="${esc(r.k)}">Remove</button>
      </div>`).join('')||'<div class="empty">No recipe matches.</div>'}</div>
    ${list.length>(state.mLimit||60)?`<button class="more" id="mMore">Show ${list.length-(state.mLimit||60)} more</button>`:''}
    ${removed.length?`<details class="m-removed"><summary>Removed recipes (${removed.length})</summary>${removed.map(r0=>`
      <div class="m-row" style="--c:${col(r0)}"><span class="dot"></span><div class="m-main"><b>${esc(r0.fg)}</b> <span>${esc(r0.bulk)}</span><div class="m-sub">Line ${r0.line} · ${r0.size} cc</div></div>
      <button class="btn" data-mrestore="${esc(r0.line+'|'+r0.sheet)}">Restore</button></div>`).join('')}</details>`:''}`;
  v.innerHTML = h;
  const mq=$('#mq');
  mq.oninput = () => { state.mq=mq.value; const pos=mq.selectionStart; renderManage(); const n2=$('#mq'); n2.focus(); try{n2.setSelectionRange(pos,pos);}catch(e){} };
}
$('#viewManage').addEventListener('click', e => {
  const b=e.target.closest('button'); if(!b || b.disabled) return;
  if (b.id==='mNew') editRecipe(null);
  else if (b.dataset.medit) editRecipe(b.dataset.medit);
  else if (b.dataset.mdel) removeRecipe(b.dataset.mdel);
  else if (b.dataset.mrestore){ const e=edits(), k=b.dataset.mrestore, r0=DATA.recipes.find(x=>(x.line+'|'+x.sheet)===k);
    e.removed=e.removed.filter(x=>x!==k); if(r0) logChange(e,{action:'restored', k, fg:r0.fg, bulk:r0.bulk, line:r0.line, size:r0.size});
    saveEdits(e); refreshAll(); toast('Restored'); }
  else if (b.id==='mMore'){ state.mLimit=1e9; renderManage(); }
  else if (b.id==='mExport') exportFile();
  else if (b.id==='mUndo'){ if(confirm('Undo all recipe changes made on this device? This puts every recipe back to how it is in the file.')){ saveEdits({added:[],edited:{},removed:[],log:[]}); refreshAll(); toast('All changes undone'); } }
  else if (b.id==='mSetPw'||b.id==='mChgPw') passwordDialog(b.id==='mChgPw');
  else if (b.id==='mLock'){ setUnlocked(false); renderManage(); toast('Locked'); }
});
function uniqueSheet(name, line, k){
  let s=name, i=2; const taken=new Set(R.filter(r=>r.line==line&&r.k!==k).map(r=>r.sheet));
  DATA.recipes.forEach(r0=>{ if(r0.line==line && (r0.line+'|'+r0.sheet)!==k) taken.add(r0.sheet); });
  while(taken.has(s)) s=`${name} (${i++})`;
  return s;
}
function editRecipe(k, prefill){
  if (!canManage()){ setTab('manage'); return; }
  const cur = k ? byKey[k] : null;
  if (k && !cur){ toast('That recipe was removed'); return; }
  const isNew = !cur;
  const r = cur ? {...cur} : {fg:'', bulk:'', line:9, size:225};
  const val = key => prefill && key in prefill ? prefill[key] : r[key];
  const sizeOpts = l => SIZES[l].map(s=>`<option value="${s}"${s==r.size?' selected':''}>${s} cc</option>`).join('');
  let h = `<div class="p-head m-edit">
      <button class="iconbtn" id="pClose" aria-label="Close">${CLOSE_SVG}</button>
      <div class="p-fg">${isNew?'New recipe':'Edit recipe'}</div>
      <div class="p-bulk">${isNew?'Fill in the item and its settings':esc(r.fg+' '+r.bulk)+' · Line '+r.line+' · '+r.size+' cc'}</div></div>
    <div class="p-body">
    <div class="m-grid">
      <label class="field"><span>FG item</span><input class="inp" id="eFg" value="${esc(r.fg)}" placeholder="e.g. 2684" autocomplete="off"></label>
      <label class="field"><span>Bulk item</span><input class="inp" id="eBulk" value="${esc(r.bulk)}" placeholder="e.g. A664" autocomplete="off"></label>
      <label class="field"><span>Line</span><select class="inp" id="eLine">${LINES.map(l=>`<option value="${l}"${r.line==l?' selected':''}>Line ${l}</option>`).join('')}</select></label>
      <label class="field"><span>Bottle size</span><select class="inp" id="eSize">${sizeOpts(r.line)}</select></label>
    </div>
    <div class="lock-err" id="eErr" hidden></div>`;
  GROUPS.forEach(g=>{ h += `<div class="sec"><h3>${esc(g)}</h3><div class="box">${FIELDS.filter(f=>f.group===g).map(f=>settingControl(f, val(f.key), isNew?val(f.key):r[f.key])).join('')}</div></div>`; });
  h += `</div><div class="p-foot">${isNew?'':'<button class="btn danger" id="eDel">Remove</button>'}<button class="btn" id="eCancel">Cancel</button><button class="btn primary grow" id="eSave">${isNew?'Add recipe':'Save changes'}</button></div>`;
  const p = showPanel(r,h);
  if (prefill) p.dataset.dirty='1';
  $('#eLine').onchange = () => { const l=+$('#eLine').value; $('#eSize').innerHTML = SIZES[l].map(s=>`<option value="${s}">${s} cc</option>`).join(''); p.style.setProperty('--c',col({line:l,size:+$('#eSize').value})); };
  $('#eSize').onchange = () => p.style.setProperty('--c',col({line:+$('#eLine').value,size:+$('#eSize').value}));
  const pb=p.querySelector('.p-body');
  pb.addEventListener('input', ()=>{ p.dataset.dirty='1'; if(!isNew) markChanged(p); });
  pb.addEventListener('change', ()=>{ p.dataset.dirty='1'; if(!isNew) markChanged(p); });
  $('#eCancel').onclick=()=>close();
  if (!isNew) $('#eDel').onclick=()=>{ if(removeRecipe(k)) close(true); };
  $('#eSave').onclick=()=>{
    const er=$('#eErr'); er.hidden=true;
    const fg=$('#eFg').value.trim().toUpperCase(), bulk=$('#eBulk').value.trim().toUpperCase(), line=+$('#eLine').value, size=+$('#eSize').value;
    if (!fg){ er.hidden=false; er.textContent='Enter the FG item.'; $('#eFg').focus(); return; }
    const dup = R.find(x=>x.k!==k && String(x.fg).toUpperCase()===fg && String(x.bulk).toUpperCase()===bulk && x.line===line && x.size===size);
    if (dup && !confirm(`There is already a recipe for ${fg} ${bulk} on Line ${line}, ${size} cc. Save this one too?`)) return;
    const rec = {fg, bulk, line, size, id:(fg+' '+bulk).trim()};
    p.querySelectorAll('.vin').forEach(i=>{ const v=toVal(i.value); if(!blank(v)) rec[i.dataset.k]=v; });
    const e=edits();
    const was = v => blank(v) ? '' : String(v);
    const fields = isNew ? [] : [
      ...(String(cur.fg).toUpperCase()!==fg ? ['FG item'] : []), ...(String(cur.bulk||'').toUpperCase()!==bulk ? ['Bulk item'] : []),
      ...(+cur.line!==line ? ['Line'] : []), ...(+cur.size!==size ? ['Bottle size'] : []),
      ...FIELDS.filter(f=>was(cur[f.key])!==was(rec[f.key])).map(f=>f.label)];
    if (!isNew && !fields.length){ close(true); toast('Nothing changed'); return; }
    if (isNew){
      const nk='new|'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      rec.sheet=uniqueSheet(rec.id, line, nk); rec.k=nk; e.added.push(clean(rec)); e.added[e.added.length-1].k=nk; k=nk;
    } else if (cur.status==='new'){
      rec.sheet=uniqueSheet(cur.sheet===cur.id||!cur.sheet?rec.id:cur.sheet, line, k);
      const i=e.added.findIndex(a=>a.k===k); e.added[i]={...clean(rec), k};
    } else {
      const base=DATA.recipes.find(r0=>(r0.line+'|'+r0.sheet)===k);
      rec.sheet=base.sheet; if (base.id && (fg+' '+bulk)===(base.fg+' '+base.bulk)) rec.id=base.id;
      const same = JSON.stringify(clean(rec))===JSON.stringify(clean({...base}));
      if (same) delete e.edited[k]; else e.edited[k]=clean(rec);
    }
    logChange(e, {action:isNew?'added':'edited', k, fg, bulk, line, size, fields});
    saveEdits(e);
    close(true); refreshAll(); toast(isNew?'✓ Recipe added':'✓ Changes saved');
  };
  setTimeout(()=>{ (isNew?$('#eFg'):p.querySelector('.kv.chg .vin')||$('#eFg')).focus({preventScroll:true}); },60);
}
function removeRecipe(k){
  const r=byKey[k]; if(!r) return false;
  if (!confirm(`Remove ${r.fg} ${r.bulk} (Line ${r.line}, ${r.size} cc)?`+(r.status==='new'?'':'\n\nYou can restore it later under "Removed recipes".'))) return false;
  const e=edits();
  if (r.status==='new') e.added=e.added.filter(a=>a.k!==k);
  else { delete e.edited[k]; if(!e.removed.includes(k)) e.removed.push(k); }
  logChange(e, {action:'removed', k, fg:r.fg, bulk:r.bulk, line:r.line, size:r.size});
  saveEdits(e); refreshAll(); toast('Recipe removed'); return true;
}
function exportFile(){
  const recs = [...R].sort((a,b)=>a.order-b.order).map(clean);
  // in the downloaded file every recipe's key becomes line|sheet, so point its history at the new key
  const newKey = Object.fromEntries(R.map(r=>[r.k, r.line+'|'+r.sheet]));
  const history = allHistory().reverse().map(({local, ...h})=>({...h, k: newKey[h.k] || h.k}));
  const data = {fields: DATA.fields, recipes: recs, rev: Date.now().toString(36), guideDate: GUIDE_DATE, guideCount: GUIDE_COUNT, history};
  const json = JSON.stringify(data).replace(/</g,'\\u003c');
  const m = PAGE_SRC.match(/const DATA = .*;\n/);
  if (!m){ toast('Could not build the file'); return; }
  const out = PAGE_SRC.replace(m[0], ()=>'const DATA = '+json+';\n');
  download('cremer-recipes.html', out, 'text/html');
  const wrap=document.createElement('div'); wrap.className='pw-modal show';
  wrap.innerHTML = `<div class="pw-box">
    <h2>Updated file downloaded ✓</h2>
    <p>It has all ${R.length} recipes with your changes built in. To give everyone the update, replace <b>cremer-recipes.html</b> in Teams / OneDrive with the downloaded file (same name, choose <b>Replace</b>).</p>
    <div class="pw-acts"><button class="btn primary grow" id="exDone">Done</button></div>
    <div class="lock-note">Your changes also stay saved on this device. The downloaded file starts fresh, so the changes won’t be counted twice.</div>
  </div>`;
  document.body.appendChild(wrap);
  const done=()=>{ wrap.classList.remove('show'); setTimeout(()=>wrap.remove(),200); };
  $('#exDone').onclick=done; wrap.addEventListener('click',ev=>{ if(ev.target===wrap) done(); });
}

addEventListener('storage', e => {
  if (e.key==='cremer.'+EKEY) refreshAll();
});

buildRecipes(); renderFilters(); render();

/* update history panel (sticky on wide screens; a drawer from the History button on smaller ones) */
const ACT = {added:'Added', edited:'Edited', removed:'Removed', restored:'Restored'};
let histAll = false;
function renderHistory(){
  const all = allHistory(), shown = histAll ? all : all.slice(0, 40);
  const days = []; shown.forEach(h=>{ const d=fmtDay(h.at); if(!days.length || days[days.length-1].d!==d) days.push({d, items:[]}); days[days.length-1].items.push(h); });
  const local = all.filter(h=>h.local).length;
  $('#hist').innerHTML = `<div class="h-head"><div><b>Update history</b><small>${all.length ? all.length+' change'+(all.length>1?'s':'') : 'No changes yet'}</small></div>
      <button class="iconbtn h-close" id="histClose" aria-label="Hide history" title="Hide history"><span class="x">${CLOSE_SVG}</span><svg class="hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m13 6 6 6-6 6"/><path d="M5 6v12"/></svg></button></div>
    <div class="h-list">
      ${days.map(g=>`<div class="h-day">${esc(g.d)}</div>${g.items.map(h=>`
        <button class="h-item" data-hk="${esc(h.k)}" style="--c:${col(h)}" type="button">
          <span class="dot"></span>
          <span class="h-main"><span class="h-t"><b>${esc(h.fg)}</b> ${esc(h.bulk||'')}</span>
            <small>Line ${esc(h.line)} · ${esc(h.size)} cc${h.local?' · <em>this device</em>':''}</small>
            ${h.fields&&h.fields.length?`<small class="h-f">${esc(h.fields.join(', '))}</small>`:''}</span>
          <span class="h-act ${h.action}">${ACT[h.action]||esc(h.action)}</span>
        </button>`).join('')}`).join('')}
      ${all.length>shown.length?`<button class="more h-more" id="histMore" type="button">Show all ${all.length}</button>`:''}
      <div class="h-day">${esc(fmtDay(GUIDE_DATE))}</div>
      <div class="h-item base"><span class="dot"></span><span class="h-main"><span class="h-t"><b>Cremer Recipe Guides</b></span><small>Line 9 &amp; Line 10 · ${GUIDE_COUNT} recipes imported</small></span><span class="h-act base">Guide</span></div>
    </div>
    ${local?`<div class="h-foot">${local} change${local>1?'s':''} on this device only. Share them with <b>Download updated file</b> in Manage.</div>`:''}`;
}
$('#hist').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if (b.id==='histClose' || b.closest('#histClose')){ if (wideHist()) setHistHidden(true); else $('#hist').classList.remove('open'); return; }
  if (b.id==='histMore'){ histAll=true; renderHistory(); return; }
  if (b.dataset.hk){ const r=byKey[b.dataset.hk]; if(!r){ toast('That recipe was removed'); return; } $('#hist').classList.remove('open'); open(r.uid); }
});
const wideHist = () => matchMedia('(min-width:1180px)').matches;
function setHistHidden(h){ document.documentElement.classList.toggle('hist-hidden', h); store.set('histHidden', h); }
$('#histFab').onclick = () => { if (wideHist()) setHistHidden(false); else $('#hist').classList.toggle('open'); };
requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('no-anim')));
renderHistory();
/* the search strip gets its background once it is pinned under the top bar — watched with an
   IntersectionObserver instead of measuring the page on every scroll event */
const stk=$('.sticky'), sentinel=document.createElement('div'); sentinel.style.cssText='height:1px;margin-bottom:-1px'; stk.before(sentinel);
let stuckObs; const watchStuck=()=>{ if(stuckObs) stuckObs.disconnect(); const top=parseFloat(getComputedStyle(stk).top)||0;
  stuckObs=new IntersectionObserver(([en])=>{ const on=!en.isIntersecting && en.boundingClientRect.top < top+2; stk.classList.toggle('stuck', on); }, {rootMargin:`-${top+1}px 0px 0px 0px`});
  stuckObs.observe(sentinel); };
watchStuck(); let rsz; addEventListener('resize',()=>{ clearTimeout(rsz); rsz=setTimeout(watchStuck,200); });
</script>
