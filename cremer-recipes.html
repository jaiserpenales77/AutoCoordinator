<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cremer Recipes</title>
<meta name="description" content="Look up Cremer counter settings for Line 9 and Line 10 by FG item or bulk item.">
<style>
:root{
  --bg:#f6f7fb; --glass:rgba(255,255,255,.9); --card:#ffffff; --ink:#171a24; --ink2:#5b6172; --ink3:#9399a8; --line:#e5e7ee;
  --g1:#4f46e5; --g2:#4f46e5; --g3:#4f46e5; --grad:var(--g1);
  --blob1:#c4b5fd; --blob2:#fbcfe8; --blob3:#a5f3fc; --blob4:#fde68a;
  --c-g:#10b981; --c-y:#eab308; --c-b:#3b82f6; --c-p:#ec4899; --c-v:#8b5cf6;
  --warn:#b45309; --warn-bg:#fef3c7; --k1:var(--ink); --k2:var(--ink); --k3:var(--ink); --k4:var(--ink); --ok:#059669; --diff:#fff4d4;
  --shadow:0 1px 2px rgba(20,20,40,.04),0 6px 18px rgba(20,20,40,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101218; --glass:rgba(24,27,35,.92); --card:#181b23; --ink:#eef0f5; --ink2:#aab0be; --ink3:#727989; --line:#2a2e39;
  --g1:#818cf8; --g2:#818cf8; --g3:#818cf8;
  --blob1:#4c1d95; --blob2:#831843; --blob3:#155e75; --blob4:#713f12;
  --warn:#fbbf24; --warn-bg:#3a2e10; --k1:var(--ink); --k2:var(--ink); --k3:var(--ink); --k4:var(--ink); --ok:#34d399; --diff:#3a3214;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#101218; --glass:rgba(24,27,35,.92); --card:#181b23; --ink:#eef0f5; --ink2:#aab0be; --ink3:#727989; --line:#2a2e39;
  --g1:#818cf8; --g2:#818cf8; --g3:#818cf8;
  --blob1:#4c1d95; --blob2:#831843; --blob3:#155e75; --blob4:#713f12;
  --warn:#fbbf24; --warn-bg:#3a2e10; --k1:var(--ink); --k2:var(--ink); --k3:var(--ink); --k4:var(--ink); --ok:#34d399; --diff:#3a3214;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}

/* colourful animated background */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;width:52vmax;height:52vmax;border-radius:50%;filter:blur(70px);opacity:.75;animation:drift 22s ease-in-out infinite alternate}
.bgfx i:nth-child(1){background:var(--blob1);top:-22vmax;left:-14vmax}
.bgfx i:nth-child(2){background:var(--blob2);top:-18vmax;right:-18vmax;animation-delay:-6s}
.bgfx i:nth-child(3){background:var(--blob3);bottom:-28vmax;left:8vmax;animation-delay:-11s}
.bgfx i:nth-child(4){background:var(--blob4);bottom:-30vmax;right:-10vmax;opacity:.5;animation-delay:-16s}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.12)}}

.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* header */
header{position:relative;text-align:center;padding:38px 46px 20px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink2);animation:fade .5s both}
.badge b{width:8px;height:8px;border-radius:50%;background:var(--g1)}
h1{margin:12px 0 4px;font-size:clamp(28px,5.5vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.05;color:var(--ink);animation:fade .5s .05s both}
@keyframes shine{to{background-position:200% center}}
.sub{color:var(--ink2);font-size:15px;animation:fade .5s .1s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.iconbtn{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);transition:transform .15s;flex:none}
.iconbtn:hover{transform:rotate(-12deg)}
.iconbtn:active{transform:scale(.9)}
header .iconbtn{position:absolute;right:0;top:34px}

/* search + filters */
.sticky{position:sticky;top:0;z-index:5;padding:8px 0 12px}
.sticky::before{content:"";position:absolute;inset:0 -100vw;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:-1;opacity:0;transition:opacity .2s}
.sticky.stuck::before{opacity:1}
.search{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:18px;padding:0 18px;box-shadow:var(--shadow);position:relative;border:1px solid var(--line);animation:fade .5s .15s both}
.search::after{content:"";position:absolute;inset:-2px;border-radius:20px;padding:2px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .2s;pointer-events:none}
.search:focus-within::after{opacity:1}
.search .sicon{flex:none;width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:17px;padding:16px 0}
.search input::placeholder{color:var(--ink3)}
.search input::-webkit-search-cancel-button{display:none}
.clear{border:0;background:var(--line);width:26px;height:26px;border-radius:50%;display:none;place-items:center;color:var(--ink2)}
.search.has .clear{display:grid}
.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px;animation:fade .5s .2s both}
.sep{flex-basis:100%;height:0}
.chip{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:7px 15px;font-size:14px;font-weight:700;color:var(--ink2);display:inline-flex;align-items:center;gap:7px;transition:transform .15s,background .2s,color .2s,box-shadow .2s}
.chip:hover{transform:translateY(-2px)}
.chip:active{transform:scale(.94)}
.chip.line.on{background:var(--g1);color:#fff;border-color:var(--g1)}
.chip.size{--c:var(--g1)}
.chip.size.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.size small{opacity:.7;font-weight:600}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}

/* results */
.count{text-align:center;color:var(--ink2);font-size:13.5px;margin:6px 0 14px;font-weight:600}
.count b{color:var(--ink);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,196px));justify-content:center;gap:14px}
.card{--c:var(--g1);position:relative;overflow:hidden;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:20px 14px 16px;text-align:center;box-shadow:var(--shadow);transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s;animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(20,20,40,.12)}
.card:active{transform:translateY(-2px) scale(.98)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.card .fg{position:relative;font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.card .bulk{position:relative;color:var(--ink2);font-weight:600;font-size:14px;margin-top:3px}
.card .tag{position:relative;display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:4px 11px;border-radius:999px;background:var(--bg);color:var(--ink2);font-size:12px;font-weight:700}
.card .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.card .mini{position:relative;display:flex;justify-content:center;gap:12px;margin-top:12px;font-size:12px;color:var(--ink3);font-weight:600}
.card .mini b{color:var(--ink);font-size:14px}
mark{background:none;color:var(--g1);text-decoration:underline 3px;text-underline-offset:3px}
.empty{grid-column:1/-1;text-align:center;padding:50px 16px;color:var(--ink2)}
.empty .e{font-size:48px;display:block;margin-bottom:8px;animation:wob 2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-10deg) scale(1.1)}}
.more{display:block;margin:18px auto 0;border:0;background:var(--grad);color:#fff;border-radius:999px;padding:10px 22px;font-weight:700;transition:transform .15s}
.more:active{transform:scale(.95)}
footer{text-align:center;color:var(--ink3);font-size:12.5px;padding:34px 16px 100px}

/* detail panel */
.scrim{position:fixed;inset:0;background:rgba(20,10,40,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.panel{--c:var(--g1);position:fixed;left:50%;top:50%;width:min(560px,calc(100% - 32px));max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);background:var(--bg);z-index:21;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.28);opacity:0;visibility:hidden;transform:translate(-50%,-46%) scale(.96);transition:opacity .22s,transform .28s cubic-bezier(.2,.8,.2,1),visibility .28s}
.panel.show{opacity:1;visibility:visible;transform:translate(-50%,-50%)}
.panel .p-head,.panel .p-foot{flex:none}.panel .p-body{min-height:0}
.p-head{position:relative;overflow:hidden;padding:24px 20px 18px;text-align:center;background:var(--card);border-bottom:1px solid var(--line);border-top:5px solid var(--c)}
.p-head .iconbtn{position:absolute;right:14px;top:14px}
.p-fg{position:relative;font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:1}
.p-bulk{position:relative;font-weight:600;font-size:16px;color:var(--ink2);margin-top:4px}
.p-tag{position:relative;display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:5px 12px;border-radius:999px;background:var(--bg);color:var(--ink2);font-size:13px;font-weight:700}
.p-tag::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.p-body{flex:1;overflow:auto;padding:18px 18px 30px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 18px}
.key{--k:var(--k1);background:var(--card);border-radius:14px;padding:12px 6px;text-align:center;border:1px solid var(--line);animation:pop .4s both}
.key b{display:block;font-size:24px;font-weight:900;color:var(--k)}
.key span{font-size:11.5px;color:var(--ink2);font-weight:700}
.key:nth-child(2){--k:var(--k2);animation-delay:.05s}.key:nth-child(3){--k:var(--k3);animation-delay:.1s}.key:nth-child(4){--k:var(--k4);animation-delay:.15s}
.sec{--s:var(--g1);margin-bottom:14px;animation:fade .35s both}
.sec h3{margin:0 0 7px 4px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.box{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);transition:background .15s}
.kv:first-child{border-top:0}
.kv:hover{background:var(--bg)}
.kv .k{color:var(--ink2);font-size:14px}
.kv .v{font-weight:800;font-variant-numeric:tabular-nums;font-size:15.5px}
.v.blank{color:var(--ink3);font-weight:400}
.on-off{font-size:11.5px;font-weight:800;letter-spacing:.05em;padding:3px 10px;border-radius:999px}
.on-off.on{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.on-off.off{background:var(--line);color:var(--ink3)}
.also{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.note{color:var(--ink3);font-size:12.5px;margin-top:6px;text-align:center}
.p-foot{display:flex;gap:8px;padding:12px 16px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.btn{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-weight:700;font-size:14px;transition:transform .12s,box-shadow .2s;position:relative;overflow:hidden}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--g1);border-color:var(--g1);color:#fff}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.25;animation:rip .55s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}


/* tabs + suggestions */
.tabs{display:flex;gap:4px;margin:0 auto 14px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;box-shadow:var(--shadow)}
.tabs button{border:0;background:none;padding:8px 18px;border-radius:999px;font-weight:700;color:var(--ink2);display:inline-flex;gap:8px;align-items:center;transition:background .2s,color .2s}
.tabs button.on{background:var(--g1);color:#fff}
.tabs .n{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#ef4444;color:#fff;font-size:11.5px;display:inline-grid;place-items:center}
.tabs .n:empty{display:none}
[hidden]{display:none!important}
.card .sbadge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:2px 7px}
.sbanner{display:block;width:100%;border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:700;margin-bottom:14px;text-align:center}
.hint{background:color-mix(in srgb,var(--g1) 9%,var(--card));border:1px solid color-mix(in srgb,var(--g1) 25%,transparent);border-radius:12px;padding:11px 14px;font-size:14px;color:var(--ink2);margin-bottom:14px;text-align:center}
.hint b{color:var(--ink);display:block;font-size:15px;margin-bottom:2px}
.field{display:block;margin-bottom:14px}
.field>span{font-size:12px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;display:block;margin:0 0 6px 4px}
.inp{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;outline:0;resize:vertical;transition:border-color .15s,box-shadow .15s}
.inp:focus,.vin:focus{border-color:var(--g1);box-shadow:0 0 0 3px color-mix(in srgb,var(--g1) 18%,transparent)}
.kv .ed{display:flex;align-items:center;gap:7px;flex:none}
.kv .old,.kv .arrow{display:none;color:var(--ink3);font-size:13px}
.kv .old{text-decoration:line-through}
.kv.chg{background:color-mix(in srgb,var(--g1) 8%,var(--card))}
.kv.chg .old,.kv.chg .arrow{display:inline}
.vin{width:84px;text-align:right;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:6px 9px;font:inherit;font-weight:800;outline:0;transition:border-color .15s,box-shadow .15s}
select.vin{text-align:left;padding-right:4px}
.kv.chg .vin{border-color:var(--g1);color:var(--g1)}
.btn.grow{flex:1.6}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.danger{color:#dc2626}
.s-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.s-tools small{opacity:.75;font-weight:600}
.s-info{text-align:center;color:var(--ink3);font-size:12.5px;margin:2px 0 16px}
.s-list{display:grid;gap:12px;max-width:720px;margin:0 auto}
.s-card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);animation:pop .35s both;text-align:left}
.s-card.done{opacity:.7}
.s-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.s-fg{font-size:20px;font-weight:900;letter-spacing:-.02em}.s-fg small{font-size:14px;color:var(--ink2);font-weight:600;margin-left:8px}
.s-meta{font-size:12.5px;color:var(--ink3);margin-top:2px}.s-meta b{color:var(--ink2)}
.s-status{flex:none;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.s-status.done{background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok)}
.s-chg{margin-top:10px;border-top:1px solid var(--line)}
.s-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.s-row .k{color:var(--ink2)}
.s-row .vals{white-space:nowrap;font-variant-numeric:tabular-nums}
.s-row s{color:var(--ink3);margin-right:6px}
.s-row b{color:var(--g1);font-size:15px}
.s-note{margin-top:10px;padding:9px 12px;background:var(--bg);border-radius:10px;font-size:14px;color:var(--ink2)}
.s-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.s-acts .btn{flex:0 1 auto;padding:7px 12px;font-size:13px}

.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:50;transition:all .25s cubic-bezier(.2,.9,.3,1.3);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  .panel{width:calc(100% - 20px);max-height:calc(100dvh - 20px);border-radius:18px}
  header{padding-top:30px}header .iconbtn{top:24px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .card{padding:16px 8px 14px}.card .fg{font-size:20px}
  .keys{grid-template-columns:repeat(2,1fr)}
  .p-fg{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.print-only{display:none}
@page{size:auto;margin:12mm 12mm 10mm}
@media print{
  html,body{background:#fff!important;color:#14161d}
  *{animation:none!important;transition:none!important;box-shadow:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bgfx,.wrap,footer,.scrim,.p-foot,.iconbtn,.toast,.sec.also-sec,.note,.p-tag,.sbanner{display:none!important}
  .print-only{display:block}
  .panel{position:static;transform:none!important;opacity:1;visibility:visible;width:100%;max-height:none;border-radius:0;overflow:visible;background:#fff;display:block}
  /* header */
  .p-head{display:grid;grid-template-columns:1fr auto;align-items:end;gap:4px 16px;text-align:left;padding:0 0 12px;border:0;border-bottom:1px solid #d9dce3;background:#fff}
  .p-kicker{grid-column:1/-1;font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8a90a0}
  .p-name{display:flex;align-items:baseline;gap:12px}
  .p-fg{font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:.95}
  .p-bulk{font-size:18px;font-weight:600;color:#5b6172;margin:0}
  .p-size{text-align:right}
  .p-size .pill{display:inline-block;background:var(--c);color:#fff;font-weight:800;font-size:13px;padding:6px 14px;border-radius:999px}
  .p-size .paper{display:block;margin-top:4px;font-size:10px;color:#8a90a0;font-weight:600}
  /* key numbers */
  .p-body{overflow:visible;padding:14px 0 0}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 16px}
  .key{border:0;border-radius:12px;padding:10px 12px;text-align:left;background:color-mix(in srgb,var(--c) 10%,#fff)}
  .key b{font-size:26px;font-weight:900;color:#14161d;line-height:1.05}
  .key span{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5b6172;margin-top:2px}
  /* settings */
  .p-body{columns:2;column-gap:28px}
  .keys,.p-print-foot{column-span:all}
  .sec{break-inside:avoid;margin:0 0 12px}
  .sec h3{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#14161d;margin:0 0 4px;padding-bottom:4px;border-bottom:2px solid #14161d}
  .sec h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
  .box{border:0;border-radius:0;background:none}
  .kv{padding:4px 2px;border-top:0;border-bottom:1px solid #eceef2}
  .kv:last-child{border-bottom:0}
  .kv .k{font-size:12px;color:#4b5161}.kv .v{font-size:13.5px;font-weight:800;color:#14161d}

      <div class="bulk">${hl(r.bulk||'—',toks)}</div>
      <span class="tag">Line ${r.line} · ${r.size} cc</span>
      <div class="mini"><span>Count <b class="num">${esc(text('count',r.count))}</b></span><span>BPM <b class="num">${esc(text('bpm',r.bpm))}</b></span></div>
    </button>`).join('')}</div>` + (list.length>shown.length?`<button class="more" id="more">Show ${list.length-shown.length} more</button>`:'');
  const m=$('#more'); if(m) m.onclick=()=>{state.limit=1e9;render();};
}
$('#results').addEventListener('click', e => { const c=e.target.closest('.card'); if(c) open(+c.dataset.u); });

/* detail panel */
const rKey = r => r.line+'|'+r.sheet;           // sheet names are unique within each line's workbook
const openFor = r => sugg.filter(s=>s.key===rKey(r)&&s.status==='open').length;
const CLOSE_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
function headHtml(r){
  return `<div class="p-head">
      <button class="iconbtn" id="pClose" aria-label="Close">${CLOSE_SVG}</button>
      <div class="p-kicker print-only">Cremer recipe · Counter settings</div>
      <div class="p-name"><div class="p-fg">${esc(r.fg)}</div><div class="p-bulk">${esc(r.bulk)}</div></div>
      <div class="p-size print-only"><span class="pill"${r.line+'-'+r.size==='9-300'?' style="color:#14161d"':''}>Line ${r.line} · ${r.size} cc</span><span class="paper">${PAPER[r.line+'-'+r.size]} sheet</span></div>
      <span class="p-tag">Line ${r.line} · ${r.size} cc · ${PAPER[r.line+'-'+r.size]} sheet</span></div>`;
}
function showPanel(r,h){
  const p=$('#panel'); p.style.setProperty('--c',col(r)); p.innerHTML=h; p.classList.add('show'); p.setAttribute('aria-hidden','false'); $('#scrim').classList.add('show');
  p.querySelector('.p-body').scrollTop=0; $('#pClose').onclick=close; return p;
}
function open(uid){
  const r = byUid[uid];
  const others = R.filter(x=>x.uid!==uid&&x.fg===r.fg);
  const n = openFor(r);
  let h = headHtml(r) + `<div class="p-body">` +
    (n?`<button class="sbanner" id="pSugg">💡 ${n} suggestion${n>1?'s':''} for this recipe — view</button>`:'') +
    `<div class="keys">${KEYS.map(([k,l])=>`<div class="key"><b class="num">${esc(text(k,r[k]))}</b><span>${l}</span></div>`).join('')}</div>`;
  GROUPS.forEach((g,gi)=>{
    h += `<div class="sec" style="animation-delay:${gi*35}ms"><h3>${esc(g)}</h3><div class="box">${FIELDS.filter(f=>f.group===g).map(f=>`<div class="kv"><span class="k">${esc(f.label)}</span>${html(f.key,r[f.key])}</div>`).join('')}</div></div>`;
  });
  if (others.length) h += `<div class="sec also-sec"><h3>Same FG, other recipe</h3><div class="also">${others.map(x=>`<button class="chip size" data-go="${x.uid}" style="--c:${col(x)}"><span class="dot"></span>Line ${x.line} · ${x.size}cc${x.bulk!==r.bulk?' · '+esc(x.bulk):''}</button>`).join('')}</div></div>`;
  h += `<div class="note">Workbook sheet: “${esc(r.sheet)}”</div>
    <div class="p-print-foot print-only"><span>Source: <b>Cremer Recipe Guide Line ${r.line} (10.06.26)</b> · sheet “${esc(r.sheet)}”</span><span>Printed ${new Date().toLocaleDateString()} · Confirm settings on the machine</span></div></div>
    <div class="p-foot"><button class="btn" id="pCopy">Copy</button><button class="btn primary grow" id="pBetter">💡 Have better settings?</button><button class="btn" id="pPrint">Print</button></div>`;
  const p = showPanel(r,h);
  $('#pPrint').onclick=()=>print(); $('#pCopy').onclick=()=>copy(r);
  $('#pBetter').onclick=()=>suggest(uid);
  if (n) $('#pSugg').onclick=()=>{ close(); state.sStatus='open'; state.sFor=rKey(r); setTab('sugg'); };
  p.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open(+b.dataset.go));
}

/* "Have better settings?" — edit the values you'd change */
function suggest(uid){
  const r = byUid[uid];
  let h = headHtml(r) + `<div class="p-body">
    <div class="hint"><b>Have better settings?</b> Change the values you think should be different. Only the ones you change are sent.</div>
    <label class="field"><span>Your name</span><input class="inp" id="sName" maxlength="60" autocomplete="name" placeholder="e.g. Maria, 2nd shift" value="${esc(store.get('name',''))}"></label>`;
  GROUPS.forEach(g=>{
    h += `<div class="sec"><h3>${esc(g)}</h3><div class="box">${FIELDS.filter(f=>f.group===g).map(f=>{
      const v=r[f.key], cur=blank(v)?'':String(v);
      const ctl = TOGGLES.has(f.key)&&(blank(v)||v===0||v===1)
        ? `<select class="vin" data-k="${f.key}" data-o="${esc(cur)}"><option value=""${cur===''?' selected':''}>—</option><option value="1"${cur==='1'?' selected':''}>ON</option><option value="0"${cur==='0'?' selected':''}>OFF</option></select>`
        : `<input class="vin" data-k="${f.key}" data-o="${esc(cur)}" value="${esc(cur)}" inputmode="decimal" placeholder="—" aria-label="${esc(f.label)}">`;
      return `<div class="kv"><span class="k">${esc(f.label)}</span><span class="ed"><span class="old">${esc(text(f.key,v))}</span><span class="arrow">→</span>${ctl}</span></div>`;
    }).join('')}</div></div>`;
  });
  h += `<label class="field"><span>Why is it better? (optional)</span><textarea class="inp" id="sNote" rows="3" maxlength="500" placeholder="e.g. fewer rejects, bottles stopped jamming at the gate"></textarea></label></div>
    <div class="p-foot"><button class="btn" id="sCancel">Cancel</button><button class="btn primary grow" id="sSend" disabled>Send suggestion</button></div>`;
  const p = showPanel(r,h);
  const changes = () => [...p.querySelectorAll('.vin')].filter(i=>i.value.trim()!==i.dataset.o).map(i=>{
    const f=FIELDS.find(x=>x.key===i.dataset.k), to=i.value.trim();
    return {key:f.key,label:f.label,from:text(f.key,r[f.key]),to:text(f.key, to===''?'':(isNaN(to)?to:Number(to)))};
  });
  const refresh = () => {
    p.querySelectorAll('.vin').forEach(i=>i.closest('.kv').classList.toggle('chg', i.value.trim()!==i.dataset.o));
    const n=changes().length, name=$('#sName').value.trim();
    $('#sSend').disabled = !n || !name;
    $('#sSend').textContent = !n ? 'Change a value first' : !name ? 'Add your name' : `Send ${n} change${n>1?'s':''}`;
  };
  p.addEventListener('input', refresh); p.addEventListener('change', refresh); refresh();
  $('#sCancel').onclick=()=>open(uid);
  $('#sSend').onclick=()=>{
    const ch=changes(), name=$('#sName').value.trim(); if(!ch.length||!name) return;
    store.set('name',name);
    sugg.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), key:rKey(r), fg:r.fg, bulk:r.bulk, line:r.line, size:r.size, sheet:r.sheet,
      name, note:$('#sNote').value.trim(), changes:ch, at:new Date().toISOString(), status:'open'});
    saveSugg(); render(); open(uid); toast('✓ Thanks! Suggestion saved');
  };
  setTimeout(()=>{ const n=$('#sName'); (n.value?p.querySelector('.vin'):n).focus({preventScroll:true}); },60);
}
function close(){ $('#panel').classList.remove('show'); $('#panel').setAttribute('aria-hidden','true'); $('#scrim').classList.remove('show'); }
$('#scrim').onclick=close;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') close();
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); setTab('recipes'); $('#q').focus(); }
});
function copyText(t,msg){
  const ok=()=>toast(msg||'✓ Copied'), fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok();}catch(e){toast('Copy not available');}a.remove();};
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(ok,fb); else fb();
}
function copy(r){
  let t=`${r.fg} ${r.bulk} — Line ${r.line}, ${r.size}cc\n`;
  GROUPS.forEach(g=>{ t+=`\n${g}\n`; FIELDS.filter(f=>f.group===g).forEach(f=>t+=`  ${f.label}: ${text(f.key,r[f.key])}\n`); });
  copyText(t);
}

/* Suggestions tab (saved in this browser) */
function updateSugN(){ const n=sugg.filter(s=>s.status==='open').length; $('#sugN').textContent=n||''; }
const fmtDate = iso => { const d=new Date(iso); return d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); };
function setTab(t){
  state.tab=t;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $('#viewRecipes').hidden = t!=='recipes'; $('#viewSugg').hidden = t!=='sugg';
  if (t==='sugg') renderSugg(); else state.sFor=null;
  scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ if(b.dataset.tab==='sugg') state.sFor=null; setTab(b.dataset.tab); });
function renderSugg(){
  const st=state.sStatus;
  const base = sugg.filter(s=>!state.sFor||s.key===state.sFor);
  const cnt = k => base.filter(s=>k==='all'||s.status===k).length;
  const list = base.filter(s=>st==='all'||s.status===st);
  const forR = state.sFor && R.find(r=>rKey(r)===state.sFor);
  let h = `<div class="s-tools">
      ${[['open','Open'],['done','Done'],['all','All']].map(([k,l])=>`<button class="chip line ${st===k?'on':''}" data-st="${k}">${l} <small>${cnt(k)}</small></button>`).join('')}
      ${forR?`<button class="chip" id="sForX">For ${esc(forR.fg)} ${esc(forR.bulk)} ✕</button>`:''}
    </div>
    <div class="s-tools"><button class="chip" id="sCopyAll">Copy all</button><button class="chip" id="sCsv">Download (Excel)</button></div>
    <div class="s-info">Suggestions are saved on this device. Use <b>Copy all</b> or <b>Download</b> to send them on.</div>`;
  if (!list.length) h += `<div class="empty"><span class="e">💡</span><b>${sugg.length?'Nothing here.':'No suggestions yet.'}</b><br>Open a recipe and tap “Have better settings?” to suggest a change.</div>`;
  else h += `<div class="s-list">${list.map((s,i)=>{
      const r=R.find(x=>rKey(x)===s.key);
      return `<div class="s-card ${s.status}" style="--c:var(${COLORS[s.line+'-'+s.size]});animation-delay:${Math.min(i,10)*30}ms">
        <div class="s-top"><div><div class="s-fg">${esc(s.fg)}<small>${esc(s.bulk)}</small></div>
          <div class="s-meta">Line ${s.line} · ${s.size} cc · by <b>${esc(s.name)}</b> · ${esc(fmtDate(s.at))}</div></div>
          <span class="s-status ${s.status}">${s.status==='open'?'Open':'Done'}</span></div>
        <div class="s-chg">${s.changes.map(c=>`<div class="s-row"><span class="k">${esc(c.label)}</span><span class="vals"><s>${esc(c.from)}</s>→ <b>${esc(c.to)}</b></span></div>`).join('')}</div>
        ${s.note?`<div class="s-note">“${esc(s.note)}”</div>`:''}
        <div class="s-acts">${r?`<button class="btn" data-open="${r.uid}">Open recipe</button>`:''}
          <button class="btn" data-done="${s.id}">${s.status==='open'?'✓ Mark done':'Reopen'}</button>
          <button class="btn danger" data-del="${s.id}">Delete</button></div>
      </div>`; }).join('')}</div>`;
  $('#viewSugg').innerHTML = h;
}
$('#viewSugg').addEventListener('click', e => {
  const b=e.target.closest('button'); if(!b) return;
  if (b.dataset.st){ state.sStatus=b.dataset.st; renderSugg(); }
  else if (b.id==='sForX'){ state.sFor=null; renderSugg(); }
  else if (b.dataset.open) open(+b.dataset.open);
  else if (b.dataset.done){ const s=sugg.find(x=>x.id===b.dataset.done); s.status=s.status==='open'?'done':'open'; saveSugg(); renderSugg(); render(); toast(s.status==='done'?'Marked done':'Reopened'); }
  else if (b.dataset.del){ if(confirm('Delete this suggestion?')){ sugg=sugg.filter(x=>x.id!==b.dataset.del); saveSugg(); renderSugg(); render(); toast('Deleted'); } }
  else if (b.id==='sCopyAll'){ copyText(suggText(), '✓ Suggestions copied'); }
  else if (b.id==='sCsv'){ downloadCsv(); }
});
function shown(){ return sugg.filter(s=>(!state.sFor||s.key===state.sFor)&&(state.sStatus==='all'||s.status===state.sStatus)); }
function suggText(){
  const l=shown(); if(!l.length) return 'No suggestions.';
  return l.map(s=>`${s.fg} ${s.bulk} — Line ${s.line}, ${s.size}cc (${s.status})\nBy ${s.name}, ${fmtDate(s.at)}\n`+
    s.changes.map(c=>`  ${c.label}: ${c.from} → ${c.to}`).join('\n')+(s.note?`\n  Note: ${s.note}`:'')).join('\n\n');
}
function downloadCsv(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Date','Name','FG item','Bulk item','Line','Bottle (cc)','Sheet','Setting','Current','Suggested','Note','Status']];
  shown().forEach(s=>s.changes.forEach(c=>rows.push([fmtDate(s.at),s.name,s.fg,s.bulk,s.line,s.size,s.sheet,c.label,c.from,c.to,s.note,s.status])));
  if (rows.length<2){ toast('Nothing to download'); return; }
  const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`cremer-suggestions-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
addEventListener('storage', e => { if(e.key==='cremer.suggestions'){ sugg=store.get('suggestions',[]); updateSugN(); render(); if(state.tab==='sugg') renderSugg(); } });

updateSugN(); renderFilters(); render();
const stk=$('.sticky'); addEventListener('scroll',()=>stk.classList.toggle('stuck',stk.getBoundingClientRect().top<=0&&scrollY>40),{passive:true});
</script>
</body>
